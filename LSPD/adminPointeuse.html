<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin pointage - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/colors.css">
  <link rel="stylesheet" href="styles/loader.css">
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/warning.css">
  <link rel="stylesheet" href="styles/adminPointeuse.css">
</head>

<body>
  <div class="main-container">

    <div id="sidebar-container"></div>
    <h1>Configuration pointeuse</h1>

    <form id="add-role-form">
      <input type="text" id="role_id" placeholder="ID du rôle Discord" required />
      <input type="text" id="role_name" placeholder="Nom du rôle" required />
      <input type="number" id="salary_rate" placeholder="Salaire $/h" step="0.01" required />
      <input type="number" id="rank" placeholder="Rang (plus petit = + haut)" required />
      <button type="submit">Ajouter</button>
    </form>

    <h2>Rôles & Salaires</h2>
    <table>
      <thead>
        <tr>
          <th>ID Rôle</th>
          <th>Nom</th>
          <th>Salaire $/h</th>
          <th>Rang</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="roles-body"></tbody>
    </table>

    <h2>Salaires par Utilisateur</h2>
    <table>
      <thead>
        <tr>
          <th>Nom Discord</th>
          <th>ID</th>
          <th>Salaire cette semaine ($)</th>
          <th>Salaire semaine dernière ($)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-salary-body"></tbody>
    </table>
  </div>
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
  </div>
  <script src="scripts/loadSidebar.js"></script>
  <script src="scripts/adminPointeuse.js"></script>
</body>

</html>
