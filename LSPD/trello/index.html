<body data-theme="black">
    <div class="main-container">
        <div id="sidebar-container"></div>

        <h1>Trello</h1>
        <div class="board-header">
            <button class="rookie-patrols-btn" id="rookiePatrolsBtn">🎓 Patrouilles avec Rookies</button>
        </div>
        <div class="board-container">
            <div class="board"></div>
            <div class="add-list-container">
                <button class="add-list-btn">+ Ajoutez une autre liste</button>

        <script src="/socket.io/socket.io.js"></script>
        <script type="module">
            import { initialize } from './scripts/board.js';
            import { showRookiePatrolsModal } from './scripts/rookieTracker.js';

            // Rendre les fonctions globales pour les onclick dans le HTML
            import { toggleCardCompact } from './scripts/card.js';
            import { removeTag, showTagSelector, hideTagSelector, toggleTagFromCheckbox, editTag, deleteTag, showCreateTagDialog } from './scripts/tags.js';
            import { openFullscreenImage, closeFullscreenImage } from './scripts/board.js';

            window.toggleCardCompact = toggleCardCompact;
            window.removeTag = removeTag;
            window.showTagSelector = showTagSelector;
            window.hideTagSelector = hideTagSelector;
            window.toggleTagFromCheckbox = toggleTagFromCheckbox;
            window.editTag = editTag;
            window.deleteTag = deleteTag;
            window.showCreateTagDialog = showCreateTagDialog;
            window.openFullscreenImage = openFullscreenImage;
            window.closeFullscreenImage = closeFullscreenImage;

            document.addEventListener('DOMContentLoaded', () => {
                const initResult = initialize();
                // Emit board:ready when initialization completes (supports sync or Promise returns)
                Promise.resolve(initResult).then(() => {
                    try { document.dispatchEvent(new Event('board:ready')); } catch (e) { }
                }).catch(() => {
                    try { document.dispatchEvent(new Event('board:ready')); } catch (e) { }
                });

                // Bouton patrouilles avec rookies
                const rookieBtn = document.getElementById('rookiePatrolsBtn');
                if (rookieBtn) {
                    rookieBtn.addEventListener('click', showRookiePatrolsModal);
                }
            });
        </script>
        <script>
            // loadSidebar.js adapté pour Trello
            document.addEventListener('DOMContentLoaded', () => {
                const container = document.getElementById('sidebar-container');
                if (!container) return;

                // Fonctions pour appliquer le cache
                function applyPermissionsFromCache() {
                    try {
                        const permsStr = localStorage.getItem('userPermissions');
                        if (!permsStr) return;
                        const perms = JSON.parse(permsStr);
                        const MAX_AGE = 24 * 60 * 60 * 1000;
                        if (!perms.timestamp || (Date.now() - perms.timestamp) >= MAX_AGE) return;
                        const canSeeSupervisor = perms.isSupervisor || perms.isCommandStaff || perms.isSuperAdmin;
                        const canSeeAdmin = perms.isCommandStaff || perms.isSuperAdmin;
                        container.querySelectorAll('.onlySupervisor').forEach(el => el.style.display = canSeeSupervisor ? 'block' : 'none');
                        container.querySelectorAll('.onlyCommandStaff').forEach(el => el.style.display = canSeeAdmin ? 'block' : 'none');
                    } catch (e) { console.warn('Erreur permissions:', e); }
                }

                function applyMiniProfileFromCache() {
                    try {
                        const profileStr = localStorage.getItem('userMiniProfile');
                        if (!profileStr) return;
                        const profile = JSON.parse(profileStr);
                        const MAX_AGE = 24 * 60 * 60 * 1000;
                        if (!profile.timestamp || (Date.now() - profile.timestamp) >= MAX_AGE) return;
                        const userProfileEl = container.querySelector('#userProfile');
                        if (!userProfileEl) return;
                        let fontSize = '16px';
                        if (profile.username.length > 15) fontSize = '13px';
                        if (profile.username.length > 20) fontSize = '11px';
                        userProfileEl.innerHTML =
                            '<span class="profile-inline" style="display:flex;align-items:center;gap:10px;">' +
                            '<img class="profile-avatar" src="' + profile.avatarUrl + '" alt="Avatar" data-user-id="' + profile.userId + '" style="width:40px;height:40px;border-radius:50%;border:1px solid #FFFFFF;flex-shrink:0;object-fit:cover;">' +
                            '<span class="profile-texts" style="display:flex;flex-direction:column;line-height:1.15;">' +
                            '<span class="profile-username" style="font-weight:700;font-size:' + fontSize + ';">' + profile.username + '</span>' +
                            '<span class="profile-grade" style="font-weight:500;font-size:0.8rem;">' + profile.grade + '</span>' +
                            '</span></span>';
                    } catch (e) { console.warn('Erreur profil:', e); }
                }

                // Si déjà chargé par instant-sidebar.js, juste charger le JS
                if (window.__sidebarLoadedFromCache) {
                    const script = document.createElement('script');
                    script.src = '/scripts/sidebar.js';
                    document.body.appendChild(script);
                    if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
                    try { document.dispatchEvent(new Event('sidebar:ready')); } catch (e) { }
                    return;
                }

                // Sinon, fetch depuis le réseau
                fetch('/sidebar')
                    .then(res => res.text())
                    .then(html => {
                        html = html.replace(/src="data\/images\//g, 'src="/data/images/');
                        container.innerHTML = html;

                        // Appliquer le cache immédiatement
                        applyPermissionsFromCache();
                        applyMiniProfileFromCache();

                        const script = document.createElement('script');
                        script.src = '/scripts/sidebar.js';
                        document.body.appendChild(script);

                        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
                        try { document.dispatchEvent(new Event('sidebar:ready')); } catch (e) { }
                    })
                    .catch(err => console.error("Erreur chargement sidebar :", err));
            });
        </script>

        </div>

        <!-- Template pour les listes avec structure de scroll -->

        <div id="loaderOverlay" class="loader-overlay">
            <div class="loader-spinner"></div>
        </div>
        <script src="../scripts/liveUserHeartbeat.js"></script>
        <script>
            (function () {
                const overlay = document.getElementById('loaderOverlay');
                if (!overlay) return;
                overlay.style.display = 'flex';

                let sidebarReady = false;
                let boardReady = false;
                let windowReady = false;

                const tryHide = () => {
                    if (sidebarReady && boardReady && windowReady) overlay.style.display = 'none';
                };

                const onSidebar = () => { sidebarReady = true; tryHide(); document.removeEventListener('sidebar:ready', onSidebar); };
                const onBoard = () => { boardReady = true; tryHide(); document.removeEventListener('board:ready', onBoard); };

                document.addEventListener('sidebar:ready', onSidebar);
                document.addEventListener('board:ready', onBoard);

                if (document.readyState === 'complete') { windowReady = true; tryHide(); }
                else window.addEventListener('load', () => { windowReady = true; tryHide(); });

                setTimeout(() => { overlay.style.display = 'none'; }, 6000);
            })();
        </script>
        <script src="scripts/instant-sidebar.js"></script>
