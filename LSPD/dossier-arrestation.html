<!DOCTYPE html>
<html lang="fr">

<head>
  <link rel="stylesheet" href="styles/annonce-popup.css" />
  <meta charset="UTF-8" />
  <title>Rapport d'arrestation - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/warning.css">
  <link rel="stylesheet" href="styles/arrestation/arrestation.css" />
  <link rel="stylesheet" href="styles/context-menu.css" />
</head>

<body>
  <script src="scripts/annonce-popup.js"></script>
  <script src="scripts/context-menu.js"></script>
  <div class="main-container">
    <div id="sidebar-container"></div>    <script src="scripts/instant-sidebar.js"></script>
    <h1>Dossier d'arrestation</h1>
    <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
      ← Retour
    </button>
    <div class="warning-modern">
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
      <span>Merci de bien vérifier les informations avant de soumettre le rapport d'arrestation</span>
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
    </div>
    <div class="incident-container">

      <div class="header">
        <img src="data/images/lspd.png" alt="Logo LSPD" />
        <div class="header-title">
          <h2>LOS SANTOS POLICE DEPARTMENT</h2>
          <h3>DOSSIER D'ARRESTATION </h3>
        </div>
        <div style="width: 60px;"></div>
      </div>

      <form>
        <input type="text" id="grade" name="grade" style="display: none;" />
        <div class="inline-fields">
          <div>
            <label for="date">Date et heure de rédaction</label>
            <input type="datetime-local" id="date" name="date" required />
            <script>
              // Remplit le champ date avec la date et l'heure actuelles en heure française
              document.addEventListener('DOMContentLoaded', function () {
                const dateInput = document.getElementById('date');
                if (dateInput) {
                  const now = new Date();
                  // Convertit en heure française (Europe/Paris)
                  const offset = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
                  const year = offset.getFullYear();
                  const month = String(offset.getMonth() + 1).padStart(2, '0');
                  const day = String(offset.getDate()).padStart(2, '0');
                  const hours = String(offset.getHours()).padStart(2, '0');
                  const minutes = String(offset.getMinutes()).padStart(2, '0');
                  // Format pour input type="datetime-local"
                  const localDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
                  dateInput.value = localDateTime;
                }
              });
            </script>
          </div>
          <div>
            <label for="name">Nom de l'individu</label>
            <input type="text" name="name" id="name" required />
          </div>
        </div>

        <div class="inline-fields">
          <div>
            <label for="none" id="customButton1">Image de la personne masqué</label>
            <div class="image-picker" data-id="1">
              <label for="fileInput1" class="addImage" id="addImage1">+</label>
              <input type="file" name="mask" id="fileInput1" accept="image/*" required>
              <img id="preview1" src="" alt="Aperçu de l'image" style="display: none;">
            </div>
          </div>
          <div>
            <label for="none" id="customButton2">Image de la personne masqué</label>
            <div class="image-picker" data-id="2">
              <label for="fileInput2" class="addImage" id="addImage2">+</label>
              <input type="file" name="mask" id="fileInput2" accept="image/*" required>
              <img id="preview2" src="" alt="Aperçu de l'image" style="display: none;">
            </div>
          </div>
        </div>
        <label for="inline-fields-4-infos">Informations personnelles du suspect</label>
        <div class="inline-fields-4 border">
          <div>
            <label for="profession">Profession</label>
            <input type="text" id="profession" name="profession" required />
          </div>
          <div>
            <label for="DDN">Date de naissance</label>
            <input type="date" id="DDN" name="DDN" required />
          </div>
          <div>
            <label for="address">Adresse</label>
            <input type="text" id="address" name="address" required />
          </div>
          <div>
            <label for="tel">Numéro de téléphone</label>
            <input type="text" id="tel" placeholder="(000) 000-0000" maxlength="14" required>
          </div>
        </div>
        <div class="inline-fields-4 ">
          <div>
            <label for="droits">Lecture des droits</label>
            <input type="time" id="droits" name="droits" required />
          </div>
          <div>
            <label for="entreecellule">Entrée cellule</label>
            <input type="time" id="entreecellule" name="entreecellule" required />
          </div>
          <div>
            <label for="sortiecellule">Sortie Cellule</label>
            <input type="time" id="sortiecellule" name="sortiecellule" required />
          </div>
          <div>
            <label for="bracelet">Bracelet associé</label>
            <div class="select-box select-bracelet" id="singleSelect">
              <div class="selected-items" id="selectedBracelet"></div>
              <input type="text" class="search-input" placeholder="Rechercher" />
              <ul class="options-list"></ul>
            </div>
          </div>
        </div>
        <div class="inline-fields-4 ">
          <div>
            <label for="miranda">Droit miranda</label>
            <div class="checkbox-wrapper-34">
              <input class='tgl tgl-ios' id='miranda' type='checkbox'>
              <label class='tgl-btn' for='miranda'></label>
            </div>
          </div>
          <div>
            <label for="avocat">Avocat</label>
            <div class="checkbox-wrapper-34">
              <input class='tgl tgl-ios' id='avocat' type='checkbox'>
              <label class='tgl-btn' for='avocat'></label>
            </div>
          </div>
          <div>
            <label for="nourriture">Nourriture</label>
            <div class="checkbox-wrapper-34">
              <input class='tgl tgl-ios' id='nourriture' type='checkbox'>
              <label class='tgl-btn' for='nourriture'></label>
            </div>
          </div>
          <div>
            <label for="ems">EMS</label>
            <div class="checkbox-wrapper-34">
              <input class='tgl tgl-ios' id='ems' type='checkbox'>
              <label class='tgl-btn' for='ems'></label>
            </div>
          </div>
        </div>
        <div class="inline-fields">
          <div>
            <label for="avocatName">Nom avocat</label>
            <input type="text" id="avocatName" name="avocatName" required />
          </div>
          <div>
            <label for="officier">Agent rédacteur</label>
            <input type="text" id="officier" name="officier" readonly />
          </div>
        </div>
        <div class="inline-fields-3">
          <div style="width: 100%;">
            <label for="lieu">Lieu</label>
            <input type="text" id="lieu" name="lieu" required style="width: 100%;" />
          </div>
          <div style="width: 100%; margin-top: 10px;">
            <label for="motifArrestation">Motif d'arrestation</label>
            <textarea id="motifArrestation" name="motifArrestation" required
              style="width: 100%; min-height: 30px; max-height: 150px;"></textarea>
          </div>
          <div style="width: 100%; margin-top: 10px;">
            <label for="circonstances">Circonstance d'arrestation</label>
            <textarea id="circonstances" name="circonstances" required
              style="width: 100%; min-height: 30px; max-height: 150px;"></textarea>
          </div>
        </div>
        <div class="page-break"></div>
        <label for="inline-fields-4-infos">Informations annexes</label>
        <div class="inline-fields border">
          <div>
            <label for="arme">Arme</label>
            <input type="text" id="arme" name="DDN" required />
          </div>
          <div>
            <label for="uof">Utilisation de la force</label>
            <div class="checkbox-wrapper-34" style="margin-top: 1em;">
              <input class='tgl tgl-ios' id='uof' type='checkbox'>
              <label class='tgl-btn' for='uof'></label>
            </div>
          </div>
        </div>
        <label for="inline-fields-4-infos">Chef(s) d'accusation(s)</label>
        <ul id="listAccusations"></ul>
        <div class="inline-fields addInput" style="margin-top: 5px;">
          <div style="width:100%">
            <select id="accusations-input" name="accusations-input">
              <option value="">-- Sélectionner une accusation --</option>
            </select>
          </div>
        </div>
        <label for="liensRapportsConvoc">Rapports/Convocations liés</label>
        <ul id="liensRapportsConvoc" class="empty-list"></ul>
  <input type="hidden" name="rapports_lies" id="rapports_lies_hidden" />
        <div class="inline-fields addInput" style="margin-top: 5px;">
          <div style="width:100%">
            <input type="text" id="searchRapportConvoc" placeholder="Rechercher par nom..." />
            <div id="searchResultsRapportConvoc" class="search-results"></div>
          </div>
        </div>
      </form>
      <div class="image-container">
        <img src="data/images/patchchief.png" alt="Logo Chief" class="footer-logo" />
      </div>
    </div>
    <div class="button-container">
      <button type="submit" class="send-button">Envoyer le rapport d'arrestation</button>
    </div>
  </div>
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
  </div>
  </div>
  <div id="feedbackAnimation" style="display: none; text-align: center;"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
    integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="scripts/arrestation/arrestation.js"></script>
  <script src="scripts/loadSidebar.js"></script>
</body>

</html>
