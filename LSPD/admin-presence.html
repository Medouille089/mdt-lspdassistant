<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Admin présence - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/checkmark.css">
    <link rel="stylesheet" href="styles/absence/admin-presence.css" />
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">

        <div id="sidebar-container"></div>
        <h1>Pannel présences IG</h1>
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>

        <section class="content-section">
            <div id="presence-list">
            </div>
        </section>
    </div>
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>
    <script src="scripts/presence/admin-presence.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script>
        (function () {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function init() {
                const btn = document.getElementById('backlinkBtn');
                if (!btn) return;

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'adminMenu.html';
                    }
                });
            }
        })();
    </script> 
</body>

</html>
