<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Admin - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/colors.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="styles/loader.css">
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/warning.css">
</head>

<body>
  <div class="main-container">

    <div id="sidebar-container"></div>

    <h1>Pannel configuration</h1>
    <div class="warning-modern">
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
      <span>Merci de bien vérifier les informations avant de soumettre la nouvelle configuration</span>
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
    </div>
    <form id="configForm">
      <!-- Catégorie : Rôles -->
      <fieldset>
        <legend>&nbsp;&nbsp;Rôles&nbsp;&nbsp;</legend>
        <label>Rôle command staff : <input type="text" name="commandstaff_id"></label><br>
        <label>Rôle supervisor : <input type="text" name="supervisor_role_id"></label><br>
        <label>Rôle requis : <input type="text" name="required_role_id"></label><br>
      </fieldset>

      <!-- Catégorie : Bracelets -->
      <fieldset>
        <legend>&nbsp;&nbsp;Bracelets&nbsp;&nbsp;</legend>
        <label>ID Archive bracelets : <input type="text" name="archive_tag"></label><br>
        <label>Salon Thread bracelets : <input type="text" name="thread_id"></label><br>
      </fieldset>

      <!-- Catégorie : Incidents -->
      <fieldset>
        <legend>&nbsp;&nbsp;Incidents&nbsp;&nbsp;</legend>
        <label>Salon Thread incidents : <input type="text" name="incident_thread_id"></label><br>
        <label>Salon Thread situations : <input type="text" name="situations_thread_id"></label><br>
      </fieldset>

      <!-- Catégorie : Arrestation -->
      <fieldset>
        <legend>&nbsp;&nbsp;Arrestation&nbsp;&nbsp;</legend>
        <label>Salon Thread arrestation : <input type="text" name="arrestation_thread_id"></label><br>
      </fieldset>

      <!-- Catégorie : Arrestation -->
      <fieldset>
        <legend>&nbsp;&nbsp;Convocation&nbsp;&nbsp;</legend>
        <label>Salon Thread convocation : <input type="text" name="convocation_thread_id"></label><br>
      </fieldset>

      <!-- Autres -->
      <fieldset>
        <legend>&nbsp;&nbsp;Autres&nbsp;&nbsp;</legend>
        <label>Salon logs : <input type="text" name="logs_channel"></label><br>
        <label>Salon rappel pointeuse : <input type="text" name="pointeuse_alert"></label><br>
      </fieldset>

      <br>
      <button class="btn-save" type="submit">Sauvegarder</button>
    </form>

    <a href="adminPointeuse.html">Admin Pointeuse</a>
    <div id="statusMessage" style="margin-top:10px;"></div>
    <div class="loader-overlay" id="loaderOverlay">
      <div class="loader-spinner"></div>
    </div>
    <div id="feedbackAnimation" style="display: none; text-align: center;"></div>
    <script src="scripts/admin.js"></script>
    <script src="scripts/loadSidebar.js"></script>

</body>

</html>
