<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Gestion des comptes - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/bracelet/getBracelet.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/warning.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <link rel="stylesheet" href="styles/liste-rapports.css" />
    <link rel="stylesheet" href="styles/admin-accounts.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">

        <div id="sidebar-container"></div>
        <script src="scripts/instant-sidebar.js"></script>

        <h1>Gestion des comptes</h1>

        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour" style="margin-top: 10px !important;">
            <span class="material-symbols-rounded">arrow_back</span> Retour
        </button>

        <div class="warning-modern">
            <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
                class="warning-icon-modern" />
            <span>Le compte passe inactif si la dernière connexion date de plus d'une semaine!</span>
            <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
                class="warning-icon-modern" />
        </div>

        <div class="content-wrapper">
            <div class="controls-container">
                <div class="search-box">
                    <span class="material-symbols-rounded">search</span>
                    <input type="text" id="searchInput" placeholder="Rechercher par nom ou Discord ID" autocomplete="off" />
                </div>
                <div class="filters-row">
                    <select id="statusFilter">
                        <option value="">Tous les statuts</option>
                        <option value="active">Actifs</option>
                        <option value="inactive">Inactifs</option>
                    </select>
                    <input type="date" id="dateStart" title="Date de début" />
                    <input type="date" id="dateEnd" title="Date de fin" />
                </div>
            </div>

            <div class="table-container">
                <table id="accountsTable" aria-label="Liste des comptes">
                <thead>
                    <tr>
                        <th>Avatar</th>
                        <th>Nom d'utilisateur</th>
                        <th>Display Name Discord</th>
                        <th>Discord ID</th>
                        <th>Statut</th>
                        <th>Créé le</th>
                        <th>Dernière connexion</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamique -->
                </tbody>
            </table>
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <!-- Popup de confirmation -->
    <div class="custom-confirm-overlay" id="confirmPopup">
        <div class="custom-confirm-box">
            <p id="confirmMessage">Êtes-vous sûr de vouloir supprimer ce compte ?</p>
            <div class="custom-confirm-buttons">
                <button class="btn btn-red" id="confirmDeleteBtn">Supprimer</button>
                <button class="btn btn-blue" id="cancelDeleteBtn">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Popup de notification -->
    <div class="custom-confirm-overlay" id="notificationPopup">
        <div class="custom-confirm-box">
            <h2 id="notificationTitle" style="margin-bottom: 10px;">Notification</h2>
            <p id="notificationMessage"></p>
            <div class="custom-confirm-buttons">
                <button class="btn btn-blue" id="notificationOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script src="scripts/admin-accounts.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
