<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Gestion des comptes - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/bracelet/getBracelet.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <style>
        .avatar-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }

        .status-active {
            background: #28a745;
            color: white;
        }

        .status-inactive {
            background: #dc3545;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .delete-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .date-cell {
            font-size: 0.9rem;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">

        <div id="sidebar-container"></div>
        <h1>Gestion des comptes utilisateurs</h1>
        <div class="container">
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Rechercher par nom ou Discord ID" autocomplete="off" />
            </div>

            <table id="accountsTable" aria-label="Liste des comptes">
                <thead>
                    <tr>
                        <th>Avatar</th>
                        <th>Nom d'utilisateur</th>
                        <th>Discord ID</th>
                        <th>Statut</th>
                        <th>Créé le</th>
                        <th>Dernière connexion</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamique -->
                </tbody>
            </table>

            <div class="pagination" id="pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <!-- Popup de confirmation -->
    <div class="custom-confirm-overlay" id="confirmPopup">
        <div class="custom-confirm-box">
            <p id="confirmMessage">Êtes-vous sûr de vouloir supprimer ce compte ?</p>
            <div class="custom-confirm-buttons">
                <button class="btn btn-red" id="confirmDeleteBtn">Supprimer</button>
                <button class="btn btn-blue" id="cancelDeleteBtn">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Popup de notification -->
    <div class="custom-confirm-overlay" id="notificationPopup">
        <div class="custom-confirm-box">
            <h2 id="notificationTitle" style="margin-bottom: 10px;">Notification</h2>
            <p id="notificationMessage"></p>
            <div class="custom-confirm-buttons">
                <button class="btn btn-blue" id="notificationOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script>
        let accountToDelete = null;
        let allAccounts = [];
        let filteredAccounts = [];
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;

        async function loadAccounts() {
            const loader = document.getElementById('loaderOverlay');
            loader.style.display = 'flex';

            try {
                const response = await fetch('/api/accounts');
                
                if (response.status === 403) {
                    const error = await response.json();
                    const tbody = document.querySelector('#accountsTable tbody');
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                <div style="color: #dc3545; font-size: 1.2rem; margin-bottom: 10px;">
                                    🔒 Accès refusé
                                </div>
                                <div style="color: #666;">
                                    ${error.error || 'Vous n\'avez pas les permissions nécessaires pour accéder à cette page.'}
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des comptes');
                }
                
                allAccounts = await response.json();
                filteredAccounts = [...allAccounts];
                currentPage = 1;
                displayAccounts();
            } catch (error) {
                console.error('Erreur:', error);
                const tbody = document.querySelector('#accountsTable tbody');
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #dc3545;">Erreur lors du chargement des comptes</td></tr>';
            } finally {
                loader.style.display = 'none';
            }
        }

        function displayAccounts() {
            const tbody = document.querySelector('#accountsTable tbody');
            
            if (filteredAccounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">Aucun compte trouvé</td></tr>';
                updatePagination();
                return;
            }

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageAccounts = filteredAccounts.slice(start, end);
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);

            tbody.innerHTML = pageAccounts.map(account => {
                const avatarUrl = account.discord_id && account.avatar
                    ? `https://cdn.discordapp.com/avatars/${account.discord_id}/${account.avatar}.png`
                    : 'data/images/default-avatar.png';
                
                const createdDate = new Date(account.created_at).toLocaleDateString('fr-FR', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const lastLoginDate = account.last_login ? new Date(account.last_login) : null;
                const lastLogin = lastLoginDate 
                    ? lastLoginDate.toLocaleDateString('fr-FR', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })
                    : 'Jamais';

                // Déterminer le statut basé sur la dernière connexion
                const isActive = lastLoginDate && lastLoginDate >= oneWeekAgo;
                const statusClass = isActive ? 'status-active' : 'status-inactive';
                const statusText = isActive ? 'Actif' : 'Inactif';

                return `
                    <tr data-account-id="${account.id}">
                        <td><img src="${avatarUrl}" alt="Avatar" class="avatar-img" onerror="this.src='data/images/default-avatar.png'"></td>
                        <td><strong>${escapeHtml(account.username)}</strong></td>
                        <td>${escapeHtml(account.discord_id)}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td class="date-cell">${createdDate}</td>
                        <td class="date-cell">${lastLogin}</td>
                        <td>
                            <button class="delete-btn" onclick="confirmDelete(${account.id}, '${escapeHtml(account.username).replace(/'/g, "\\'")}')">
                                Supprimer
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredAccounts.length / ITEMS_PER_PAGE);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';

            // Bouton Précédent
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Précédent</button>`;

            // Numéros de page
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button ${i === currentPage ? 'disabled' : ''} onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<span>...</span>';
                }
            }

            // Bouton Suivant
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Suivant</button>`;

            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            displayAccounts();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotification(title, message, isSuccess = true) {
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationMessage').textContent = message;
            
            // Changer la couleur du titre selon le type
            const titleEl = document.getElementById('notificationTitle');
            titleEl.style.color = isSuccess ? '#28a745' : '#dc3545';
            
            document.getElementById('notificationPopup').style.display = 'flex';
        }

        function confirmDelete(accountId, username) {
            accountToDelete = accountId;
            document.getElementById('confirmMessage').textContent = 
                `Êtes-vous sûr de vouloir supprimer le compte de "${username}" ?`;
            document.getElementById('confirmPopup').style.display = 'flex';
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!accountToDelete) return;

            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = true;
            btn.textContent = 'Suppression...';

            try {
                const response = await fetch(`/api/accounts/${accountToDelete}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (!response.ok) {
                    // Fermer le popup de confirmation
                    document.getElementById('confirmPopup').style.display = 'none';
                    
                    // Afficher l'erreur dans un popup
                    showNotification('Erreur', data.error || 'Erreur lors de la suppression', false);
                    return;
                }

                // Retirer le compte de la liste
                allAccounts = allAccounts.filter(acc => acc.id !== accountToDelete);
                filteredAccounts = filteredAccounts.filter(acc => acc.id !== accountToDelete);

                // Réafficher
                displayAccounts();

                // Fermer le popup de confirmation
                document.getElementById('confirmPopup').style.display = 'none';
                
                // Afficher le succès
                showNotification('Succès', 'Compte supprimé avec succès', true);

            } catch (error) {
                console.error('Erreur:', error);
                
                // Fermer le popup de confirmation
                document.getElementById('confirmPopup').style.display = 'none';
                
                // Afficher l'erreur
                showNotification('Erreur', error.message || 'Une erreur est survenue', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Supprimer';
                accountToDelete = null;
            }
        });

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('confirmPopup').style.display = 'none';
            accountToDelete = null;
        });

        document.getElementById('notificationOkBtn').addEventListener('click', () => {
            document.getElementById('notificationPopup').style.display = 'none';
        });

        // Recherche
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase().trim();
            
            if (!search) {
                filteredAccounts = [...allAccounts];
            } else {
                filteredAccounts = allAccounts.filter(account => 
                    account.username.toLowerCase().includes(search) ||
                    account.discord_id.toLowerCase().includes(search) ||
                    (account.email && account.email.toLowerCase().includes(search))
                );
            }
            
            currentPage = 1;
            displayAccounts();
        });

        // Charger les comptes au chargement de la page
        loadAccounts();
    </script>
</body>

</html>
