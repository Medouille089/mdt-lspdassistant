<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/admin/admin.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/genMenu.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Superviseur - LSPD Assistant</title>
    <style>
        .button-grid {
            grid-template-columns: repeat(3, 180px) !important;
            max-width: 620px !important;
        }
    </style>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/context-menu.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>Superviseur</h1>

        <div class="grid-wrapper">
            <div class="button-grid">
                <a href="/menu-sanctions" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="ban" class="icon"></i></div>
                    <span class="label">Sanction</span>
                </a>
                <a href="/admin-absences" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="calendar-x" class="icon"></i></div>
                    <span class="label">Gestion absences</span>
                </a>
                <a href="/menu-convocation-agent" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="mail" class="icon"></i></div>
                    <span class="label">Convocation agent</span>
                </a>
                <a href="/liste-officiers" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="users" class="icon"></i></div>
                    <span class="label">Gestion des agents</span>
                </a>
                <a href="/supervisorcs-ceremonie.html" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="award" class="icon"></i></div>
                    <span class="label">Fiche cérémonie</span>
                </a>
                <a href="/admin-trello.html" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="trello" class="icon"></i></div>
                    <span class="label">Logs Trello</span>
                </a>
            </div>
        </div>
    </div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/genMenu.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
