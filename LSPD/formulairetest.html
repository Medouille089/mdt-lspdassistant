<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Formulaire Embed</title>
</head>
<body>
  <h1>Formulaire Embed</h1>
  <form id="embedForm">
    <label>Nom: <input type="text" name="nom" required /></label><br>
    <label>Prénom: <input type="text" name="prenom" required /></label><br>
    <label>Images: <input type="file" id="imageInput" name="images" accept="image/*" multiple /></label><br>
    <button type="submit">Envoyer</button>
  </form>

  <script>
    document.getElementById("embedForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData();

      // Ajouter texte
      formData.append("nom", form.nom.value);
      formData.append("prenom", form.prenom.value);

      // Ajouter chaque fichier sélectionné
      const images = document.getElementById("imageInput").files;
      for (let i = 0; i < images.length; i++) {
        formData.append("images", images[i]);
      }

      const res = await fetch("/send-embed", {
        method: "POST",
        body: formData,
      });

      const result = await res.json();
      alert(result.message || "Embed envoyé !");
    });
  </script>
</body>
</html>
