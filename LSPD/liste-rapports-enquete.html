<!DOCTYPE html>
<html lang="fr">

<head>
  <link rel="stylesheet" href="styles/annonce-popup.css" />
  <meta charset="UTF-8" />
  <title>Liste des enquêtes - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/liste-rapports.css" />
  <link rel="stylesheet" href="styles/custom-notifications.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@0.294.0/font/lucide.min.css">
</head>

<body>
  <script src="scripts/annonce-popup.js"></script>
  <script src="scripts/liveUserHeartbeat.js"></script>
  <div class="main-container">
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="page-header">
      <h1>Liste des rapports d'enquête</h1>
      <button class="btn-create" onclick="window.location.href='/rapport-enquete'">
        <i data-lucide="plus"></i>
        Nouvelle enquête
      </button>
    </div>

    <div class="filters-container">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Rechercher par numéro, sujet, superviseur...">
      </div>
    </div>

    <div class="table-container">
      <table class="reports-table">
        <thead>
          <tr>
            <th>Numéro de dossier</th>
            <th>Sujet</th>
            <th>Superviseur</th>
            <th>Agents</th>
            <th>Suspects</th>
            <th>Date création</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="enquetesTableBody">
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
              Chargement...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination-container">
      <div class="pagination-info" id="paginationInfo"></div>
      <div class="pagination-controls" id="paginationControls"></div>
    </div>
  </div>

  <div id="loaderOverlay" class="loader-overlay" style="display: none;">
    <div class="loader-spinner"></div>
  </div>

  <script src="scripts/loadSidebar.js"></script>
  <script src="scripts/custom-notifications.js"></script>
  <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
  <script src="scripts/liste-rapports-enquete.js"></script>
</body>

</html>
