<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Liste Sanctions - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/bracelet/getBracelet.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <style>
        #sanctionsTable tr.archived {
            color: #dcdcdc;
            background-color: #6b6b6b;
        }
    </style>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">
        <div id="sidebar-container"></div>    <script src="scripts/instant-sidebar.js"></script>
        <h1>Liste des sanctions</h1>
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>

        <div class="container">
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Rechercher utilisateur ou agent" />
                <input type="date" id="dateStart" />
                <input type="date" id="dateEnd" />
            </div>

            <table id="sanctionsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Agent</th>
                        <th>Sanctionneur</th>
                        <th>Type</th>
                        <th>Raison</th>
                        <th>Date de</th>
                        <th>Date à</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamique -->
                </tbody>
            </table>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>
    <script src="scripts/sanctions/getSanctions.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script>
        (function () {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function init() {
                const btn = document.getElementById('backlinkBtn');
                if (!btn) return;

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = '/menu-sanctions';
                    }
                });
            }
        })();
    </script>
</body>

</html>
