<!DOCTYPE html>
<html lang="fr">

<head>
  <link rel="stylesheet" href="styles/annonce-popup.css" />
  <meta charset="UTF-8" />
  <title>Détails Convocation Agent - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/warning.css">
  <link rel="stylesheet" href="styles/popup.css">
  <link rel="stylesheet" href="styles/sanction/sanctions.css">
  <link rel="stylesheet" href="styles/context-menu.css" />
  <link rel="stylesheet" href="styles/custom-notifications.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <script src="scripts/annonce-popup.js"></script>
  <script src="scripts/context-menu.js"></script>
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-spinner"></div>
  </div>
  <div class="main-container">
    <div id="sidebar-container"></div>    <script src="scripts/instant-sidebar.js"></script>
    <h1>Détails de la Convocation Agent</h1>
    <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
      <i data-lucide="arrow-left"></i> Retour
    </button>
    <div class="sanction-container">
      <div class="header">
        <img src="data/images/lspd.png" alt="Logo LSPD">
        <div class="header-title">
          <h2>LOS SANTOS POLICE DEPARTMENT</h2>
          <h3>CONVOCATION AGENT</h3>
        </div>
        <div style="width: 70px;"></div>
      </div>
      <div class="form-content">
        <label for="agent">Agent convoqué :</label>
        <input type="text" id="agent" readonly>

        <label for="date">Date :</label>
        <input type="date" id="date" readonly>

        <label for="lieu">Lieu :</label>
        <input type="text" id="lieu" readonly>

        <label for="raison">Raison :</label>
        <textarea id="raison" readonly></textarea>



        <div id="feedbackAnimation" style="display:none; text-align: center;"></div>

        <div class="user-info-row">
          <div class="user-info-field">
            <label for="officier">Agent convoquant :</label>
            <input type="text" id="officier" readonly>
          </div>
          <div class="user-info-field">
            <label for="grade">Grade :</label>
            <input type="text" id="grade" readonly>
          </div>
        </div>

        <div class="user-info-row">
          <div class="user-info-field">
            <label for="created_at">Date de création :</label>
            <input type="text" id="created_at" readonly>
          </div>
        </div>
        <label for="commentaire">Commentaires :</label>
        <textarea id="commentaire" placeholder="Ajouter un commentaire..."
          style="margin-bottom: 0!important;"></textarea>
        <div>
          <button id="ajouterCommentaireBtn" type="button"
            style="font-size:12px;padding:3px 10px;max-width:100px;margin-top: 0!important;">Ajouter</button>
        </div>
        <!-- Bouton retour supprimé -->
      </div>
    </div>
  </div>

  <script src="scripts/loadSidebar.js"></script>
  <script src="scripts/custom-notifications.js"></script>
  <script src="scripts/convocation/viewConvocationAgent.js"></script>
</body>

</html>
