<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/admin/admin.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/checkmark.css">
    <link rel="stylesheet" href="styles/warning.css">
    <link rel="stylesheet" href="styles/genMenu.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <title>MDT - LSPD Assistant</title>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>MDT</h1>

        <div class="grid-wrapper">
            <div class="button-grid">
                <a href="/liste-citoyens" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="users" class="icon"></i></div>
                    <span class="label">Citoyens</span>
                </a>
                <a href="/liste-modeles-armes" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="package" class="icon"></i></div>
                    <span class="label">Modèles d'armes</span>
                </a>
                <a href="/arme" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="crosshair" class="icon"></i></div>
                    <span class="label">Armes</span>
                </a>
                <a href="/vehicule" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="car" class="icon"></i></div>
                    <span class="label">Véhicules</span>
                </a>
                <a href="/liste-vehicules" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="parking-square" class="icon"></i></div>
                    <span class="label">Liste véhicules</span>
                </a>
                <a href="/liste-armes" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="shield" class="icon"></i></div>
                    <span class="label">Liste armes</span>
                </a>
                <a href="/avis-recherche" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="search" class="icon"></i></div>
                    <span class="label">Avis recherche</span>
                </a>
                <a href="/rapport-arrestation" class="send-button" >
                    <div class="icon-wrapper"><i data-lucide="file-text" class="icon"></i></div>
                    <span class="label">Rapport d'arrestation</span>
                </a>
                <a href="/liste-rapports-arrestation" class="send-button" >
                    <div class="icon-wrapper"><i data-lucide="list" class="icon"></i></div>
                    <span class="label">Liste Rapports</span>
                </a>
            </div>
        </div>
    </div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/genMenu.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
