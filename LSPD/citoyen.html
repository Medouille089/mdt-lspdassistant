<!DOCTYPE html>
<html lang="fr">

<head>
  <link rel="stylesheet" href="styles/annonce-popup.css" />
  <meta charset="UTF-8" />
  <title>Enregistrer un citoyen - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/warning.css">
  <link rel="stylesheet" href="styles/sanction/sanctions.css" />
  <link rel="stylesheet" href="styles/licenses.css" />
  <link rel="stylesheet" href="styles/context-menu.css" />
  <link rel="stylesheet" href="styles/custom-notifications.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <script src="scripts/annonce-popup.js"></script>
  <script src="scripts/context-menu.js"></script>
  <div class="main-container">
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>
    <h1>Enregistrer un citoyen</h1>
    <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
      <i data-lucide="arrow-left"></i> Retour
    </button>

    <div class="warning-modern">
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
      <span>Les informations enregistrées pourront être liées aux véhicules, armes et propriétés</span>
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
    </div>

    <div class="sanction-container">
      <div class="header">
        <img src="data/images/lspd.png" alt="Logo LSPD">
        <div class="header-title">
          <h2>LOS SANTOS POLICE DEPARTMENT</h2>
          <h3>ENREGISTREMENT CITOYEN</h3>
        </div>
        <div style="width: 70px;"></div>
      </div>
      <form id="citoyenForm">

        <!-- Tags Section -->
        <div class="tags-section">
          <label class="not-label">Tags du citoyen</label>
          <div id="tagsContainer" class="tags-container">
            <!-- Tags will be injected here -->
          </div>
        </div>

        <!-- Identité -->
        <div class="inline-fields">
          <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required placeholder="Doe">
          </div>
          <div>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" required placeholder="John">
          </div>
        </div>
        <div class="inline-fields">
          <div>
            <label for="date_naissance">Date de naissance :</label>
            <input type="date" id="date_naissance" name="date_naissance" required>
          </div>
          <div>
            <label for="nationalite">Nationalité :</label>
            <input type="text" id="nationalite" name="nationalite" required placeholder="Américaine">
          </div>
        </div>
        <div class="inline-fields">
          <div>
            <label for="genre">Genre :</label>
            <select id="genre" name="genre" required>
              <option value="">-- Sélectionner --</option>
              <option value="Homme">Homme</option>
              <option value="Femme">Femme</option>
              <option value="Autre">Autre</option>
            </select>
          </div>
          <div>
            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" name="telephone" placeholder="555-XXXX" maxlength="8">
          </div>
        </div>

        <!-- Photo -->
        <label for="photoUrlInput">Photo (URL) :</label>
        <input type="url" id="photoUrlInput" name="photoUrlInput"
          placeholder="https://cdn.discordapp.com/attachments/..." style="margin-bottom: 8px;">
        <div class="photo-preview-container" style="margin: 15px 0;">
          <img id="photo_preview" src="" alt="Photo Citoyen"
            style="max-width: 120px; max-height: 120px; border-radius: 8px; object-fit: cover; background: #f8f9fa; border: 1px solid #e0e0e0; display: none;">
        </div>


        <!-- Adresse et emploi -->
        <div class="inline-fields">
          <div>
            <label for="adresse">Adresse :</label>
            <input type="text" id="adresse" name="adresse" placeholder="123 Grove St, Los Santos">
          </div>
          <div>
            <label for="emploi">Emploi :</label>
            <input type="text" id="emploi" name="emploi" placeholder="Profession du citoyen">
          </div>
        </div>

        <!-- Gang et note interne -->
        <div class="inline-fields">
          <div>
            <label for="gang_affilie">Gang affilié :</label>
            <input type="text" id="gang_affilie" name="gang_affilie" placeholder="Nom du gang (si applicable)">
          </div>
          <div>
            <label for="note_interne">Note interne :</label>
            <textarea id="note_interne" name="note_interne"
              placeholder="Notes internes, visible uniquement par le staff" style="min-height: 40px;"></textarea>
          </div>
        </div>

        <!-- Permis -->

        <div class="equipment-category">
          <h4>Permis</h4>
          <div class="licenses-grid">
            <div class="license-card" data-license="permis_A">
              <input type="checkbox" id="permis_A" class="license-checkbox">
              <label for="permis_A" class="license-label">
                <div class="license-icon"><i data-lucide="bike"></i></div>
                <div class="license-name">Permis A</div>
                <div class="license-check"><i data-lucide="check"></i></div>
              </label>
            </div>
            <div class="license-card" data-license="permis_B">
              <input type="checkbox" id="permis_B" class="license-checkbox">
              <label for="permis_B" class="license-label">
                <div class="license-icon"><i data-lucide="car"></i></div>
                <div class="license-name">Permis B</div>
                <div class="license-check"><i data-lucide="check"></i></div>
              </label>
            </div>
            <div class="license-card" data-license="permis_C">
              <input type="checkbox" id="permis_C" class="license-checkbox">
              <label for="permis_C" class="license-label">
                <div class="license-icon"><i data-lucide="truck"></i></div>
                <div class="license-name">Permis C</div>
                <div class="license-check"><i data-lucide="check"></i></div>
              </label>
            </div>
            <div class="license-card" data-license="permis_PPA">
              <input type="checkbox" id="permis_PPA" class="license-checkbox">
              <label for="permis_PPA" class="license-label">
                <div class="license-icon"><i data-lucide="shield"></i></div>
                <div class="license-name">Port d'arme</div>
                <div class="license-check"><i data-lucide="check"></i></div>
              </label>
            </div>
            <div class="license-card" data-license="permis_BRAVO">
              <input type="checkbox" id="permis_BRAVO" class="license-checkbox">
              <label for="permis_BRAVO" class="license-label">
                <div class="license-icon"><i data-lucide="plane"></i></div>
                <div class="license-name">License BRAVO</div>
                <div class="license-check"><i data-lucide="check"></i></div>
              </label>
            </div>
            <div class="license-card" data-license="permis_ASD">
              <input type="checkbox" id="permis_ASD" class="license-checkbox">
              <label for="permis_ASD" class="license-label">
                <div class="license-icon"><i data-lucide="anchor"></i></div>
                <div class="license-name">License ASD</div>
                <div class="license-check"><i data-lucide="check"></i></div>
              </label>
            </div>
          </div>
        </div>

        <!-- Mandat d'arrêt -->
        <label for="mandat_actif">Mandat d'arrêt actif :</label>
        <select id="mandat_actif" name="mandat_actif">
          <option value="false">Non</option>
          <option value="true">Oui</option>
        </select>

        <div class="button-container">
          <button type="submit" id="submitBtn">Enregistrer le citoyen</button>
        </div>
      </form>
    </div>
  </div>

  <script src="scripts/custom-notifications.js"></script>
  <script src="scripts/citoyen.js"></script>
  <script src="scripts/loadSidebar.js"></script>
  <script>
    document.getElementById('backlinkBtn').addEventListener('click', () => {
      window.history.back();
    });
  </script>
</body>

</html>
