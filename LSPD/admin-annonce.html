<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Admin - Annonce dynamique</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/incident/incident.css" />
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/admin-annonce.css" />
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">
        <div id="sidebar-container"></div>

        <h1>Faire une annonce</h1>
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>

        <div class="annonce-admin-panel">
            <label for="annonce-text">Contenu de l'annonce</label>
            <textarea id="annonce-text" rows="6" maxlength="300" placeholder="Votre annonce..."></textarea>
            <label for="annonce-duree">Durée d'affichage (secondes)</label>
            <input type="number" id="annonce-duree" min="3" max="120" value="10" />
            <button id="annonce-send">Envoyer l'annonce</button>
            <div id="annonce-feedback"></div>
        </div>
    </div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/admin-annonce.js"></script>
    <script>
        (function () {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function init() {
                const btn = document.getElementById('backlinkBtn');
                if (!btn) return;

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'adminMenu.html';
                    }
                });
            }
        })();
    </script>
</body>

</html>
