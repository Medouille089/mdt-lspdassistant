<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Documentation - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/checkmark.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <link rel="stylesheet" href="styles/confirm.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/warningCancer.css" />
    <link rel="stylesheet" href="styles/outils/faq.css" />
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>
<div id="customConfirmSend" class="custom-confirm-overlay" style="display:none;">
    <div class="custom-confirm-box">
        <p></p>
        <div class="custom-confirm-buttons">
            <button class="btn btn-blue">Annuler</button>
            <button class="btn btn-red">Confirmer</button>
        </div>
    </div>
</div>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">
        <div id="sidebar-container"></div>    <script src="scripts/instant-sidebar.js"></script>
        <h1>Documentation</h1>
        <div class="faq-container" id="faq-container">
            <!-- FAQ dynamique ici -->
        </div>
    </div>
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>

    <script>
        (function(){
            const overlay = document.getElementById('loaderOverlay');
            if (!overlay) return;
            // Show overlay immediately
            overlay.style.display = 'flex';

            let sidebarReady = false;
            let windowReady = false;

            const tryHide = () => {
                if (sidebarReady && windowReady) {
                    overlay.style.display = 'none';
                }
            };

            // When sidebar is injected
            const onSidebarReady = () => {
                sidebarReady = true;
                tryHide();
                document.removeEventListener('sidebar:ready', onSidebarReady);
            };
            document.addEventListener('sidebar:ready', onSidebarReady);

            // When window load occurs
            if (document.readyState === 'complete') {
                windowReady = true;
                tryHide();
            } else {
                window.addEventListener('load', () => {
                    windowReady = true;
                    tryHide();
                });
            }

            // Safety timeout: hide overlay after 6s to avoid permanently blocking UI
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 6000);
        })();
    </script>

    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/faq.js"></script>
    <script src="scripts/context-menu.js"></script>
</body>

</html>
