<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Liste des contrats - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/custom-notifications.css" />
    <link rel="stylesheet" href="styles/contrat/liste-contrats.css" />
    <link rel="stylesheet" href="styles/liste-rapports.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>Liste des contrats LSPD</h1>

        <div class="content-wrapper">
            <div class="stats">
                <div class="stat-card">
                    <h3>Total des contrats</h3>
                    <div class="value" id="totalContrats">0</div>
                </div>
                <div class="stat-card">
                    <h3>Contrats actifs</h3>
                    <div class="value" id="contratsActifs" style="color: #27ae60;">0</div>
                </div>
                <div class="stat-card">
                    <h3>Résiliés</h3>
                    <div class="value" id="contratsResilies" style="color: #e74c3c;">0</div>
                </div>
                <div class="stat-card">
                    <h3>Expirés</h3>
                    <div class="value" id="contratsExpires" style="color: #e74c3c;">0</div>
                </div>
            </div>

            <div class="controls-container">
                <div class="search-box">
                    <span class="material-symbols-rounded">search</span>
                    <input type="text" id="searchInput" placeholder="Rechercher (entreprise, numéro...)" autocomplete="off" />
                </div>
                <div class="filters">
                    <select id="statutFilter">
                        <option value="">Tous les statuts</option>
                        <option value="actif">Actif</option>
                        <option value="expire">Expiré</option>
                        <option value="resilie">Résilié</option>
                    </select>
                    <button class="add-btn" onclick="window.location.href='/contrat'">
                        Nouveau contrat
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table id="contratTable">
                    <thead>
                        <tr>
                            <th>Numéro</th>
                            <th>Entreprise</th>
                            <th>Représentant</th>
                            <th>Date début</th>
                            <th>Date fin</th>
                            <th>Durée</th>
                            <th>Statut</th>
                            <th>Officier</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contratTableBody">
                        <!-- Rempli dynamiquement -->
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination dynamique -->
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script src="scripts/loadSidebar.js"></script>
    <script type="module" src="scripts/liste-contrats.js"></script>
</body>

</html>
