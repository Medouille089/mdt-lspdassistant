<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Titre - LSPD Assistant</title>

    <!-- Favicon -->
    <link rel="icon" href="data/images/favicon.png" type="image/png">

    <!-- Vos autres CSS -->

    <!-- ⭐ Custom Notifications (obligatoire pour FiveM) -->
    <link rel="stylesheet" href="styles/custom-notifications.css">
    <link rel="stylesheet" href="styles/template-notifications.css">
</head>

<body>
    <div class="container">
        <h1>Template - Custom Notifications</h1>
        <p>Ce fichier est prêt à utiliser les notifications personnalisées compatibles FiveM.</p>

        <h2>Exemples d'utilisation :</h2>

        <button onclick="showNotification('Notification d\'information', 'info')">
            Test Info
        </button>

        <button onclick="showNotification('Opération réussie !', 'success')">
            Test Success
        </button>

        <button onclick="showNotification('Attention !', 'warning')">
            Test Warning
        </button>

        <button onclick="showNotification('Erreur détectée', 'error')">
            Test Error
        </button>

        <br><br>

        <button onclick="demoConfirm()">
            Test Confirm
        </button>

        <button onclick="demoPrompt()">
            Test Prompt
        </button>
    </div>

    <!-- ⭐ Custom Notifications JS (charger AVANT vos scripts) -->
    <script src="scripts/custom-notifications.js"></script>

    <!-- Votre script personnalisé -->
    <script src="scripts/template-notifications.js"></script>
