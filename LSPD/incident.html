<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Rapport d'incident - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/warning.css">
  <link rel="stylesheet" href="styles/incident/incident.css" />
</head>

<body>
  <div class="main-container">
    <div id="sidebar-container"></div>
    <h1>Rapport d'incident</h1>
    <div class="warning-modern">
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
      <span>Merci de bien vérifier les informations avant de soumettre le rapport d'incident</span>
      <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
        class="warning-icon-modern">
    </div>
    <div class="incident-container">

      <div class="header">
        <img src="data/images/lspd.png" alt="Logo LSPD" />
        <div class="header-title">
          <h2>LOS SANTOS POLICE DEPARTMENT</h2>
          <h3>RAPPORT D'INCIDENT</h3>
        </div>
        <div style="width: 60px;"></div>
      </div>

      <form>
        <div class="inline-fields">
          <div>
            <label for="date">Date de l'incident</label>
            <input type="date" id="date" name="date" />
          </div>
          <div>
            <label for="heure">Heure de l'incident</label>
            <input type="time" id="heure" name="heure" />
          </div>
        </div>

        <div class="inline-fields">
          <div>
            <label for="officier">Agent rédacteur</label>
            <input type="text" id="officier" name="officier" readonly />
          </div>
          <div>
            <label for="grade">Grade</label>
            <input type="text" id="grade" name="grade" readonly />
          </div>
        </div>

        <label for="recit">Récit</label>
        <textarea id="recit" name="recit"></textarea>

        <label for="implique">Matricules des officiers impliqués</label>
        <input type="text" id="implique" name="implique" />

        <div class="inline-fields">
          <div>
            <label for="type">Type de rapport</label>
            <input type="text" id="type" name="type" value="RAPPORT D'INCIDENT" readonly />
          </div>
          <div>
            <label for="lieu">Lieu de l'incident</label>
            <input type="text" id="lieu" name="lieu" />
          </div>
        </div>

        <label for="pieces">Pièces jointes (Images)</label>
        <div class="file-upload-wrapper">
          <label for="pieces" class="custom-file-upload">
            Sélectionner des fichiers
          </label>
          <input type="file" id="pieces" name="pieces" accept="image/*" multiple />
        </div>
      </form>
      <div class="image-container">
        <img src="data/images/patchchief.png" alt="Logo Chief" class="footer-logo" />
      </div>
    </div>
    <!-- Create select situation -->
    <div class="situation-container">
      <label for="situations">Sélectionner une situation</label>
      <div class="select-box select-situations" id="situationsSelect">
        <div class="selected-items" id="selectedSituations"></div>
        <input type="text" class="search-input" placeholder="Rechercher une situation..." />
        <ul class="options-list"></ul>
      </div>
    </div>
    <div class="button-container">
      <button type="submit" class="send-button">Envoyer le rapport d'incident</button>
    </div>
    <div class="attachments-preview" id="attachmentsPreview"></div>
  </div>
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
  </div>
  </div>
  <div id="feedbackAnimation" style="display: none; text-align: center;"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="scripts/incident/incident.js"></script>
  <script src="scripts/loadSidebar.js"></script>
</body>

</html>
