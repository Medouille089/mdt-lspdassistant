<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Convocations d'Agents - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/liste-rapports.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>Historique des Convocations d'Agents</h1>
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>

        <div class="content-wrapper">
            <div class="controls-container">
                <div class="search-box">
                    <span class="material-symbols-rounded">search</span>
                    <input type="text" id="searchInput" placeholder="Rechercher" autocomplete="off" />
                </div>
                <div class="filters">
                    <input type="date" id="dateStart" />
                    <input type="date" id="dateEnd" />
                </div>
            </div>

            <div class="table-container">
                <table id="braceletTable" aria-label="Liste des convocations d'agents">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Agent convoqué</th>
                            <th>Agent convoquant</th>
                            <th>Grade</th>
                            <th>Date</th>
                            <th>Lieu</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dynamique -->
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script src="scripts/convocation/getConvocationsAgents.js"></script>
    <script>
        (function () {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function init() {
                const btn = document.getElementById('backlinkBtn');
                if (!btn) return;

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'menu-convocation-agent';
                    }
                });
            }
        })();
    </script>
</body>

</html>
