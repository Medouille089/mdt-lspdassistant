<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Profil Véhicule - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/infosagent.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/custom-notifications.css" />
    <link rel="stylesheet" href="styles/citoyen-selector.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        .plaque-display {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 18px;
            background: #2c3e50;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            display: inline-block;
            letter-spacing: 2px;
        }

        .badge.mandat-actif {
            background: #e74c3c;
        }

        .badge.no-mandat {
            background: #27ae60;
        }

        .notes-section {
            margin-top: 20px;
        }

        .notes-section textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        .notes-section textarea:focus {
            outline: none;
            border-color: #002147;
        }

        .notes-section textarea:disabled {
            background-color: #f8f9fa;
            cursor: not-allowed;
            color: var(--text-darkk);
            border: 2px solid #dfe6e9;
            cursor: default;
        }

        .rapports-section {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
        }

        .rapports-section h4 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 16px;
        }

        .no-rapports {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
        }

        .proprietaire-selector {
            position: relative;
        }

        .proprietaire-selector input {
            width: 100%;
            padding-right: 140px;
            cursor: pointer;
        }

        .proprietaire-selector button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 16px;
            background-color: #002147;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .proprietaire-selector button:hover {
            background-color: #003366;
        }

        /* Modal d'agrandissement de photo */
        .photo-zoom-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        .photo-zoom-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .photo-zoom-modal .close-zoom {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .photo-zoom-modal .close-zoom:hover {
            color: #bbb;
        }

        .agent-photo {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/context-menu.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>
        <div class="agent-profile-container">
            <!-- Header avec photo et infos -->
            <div class="agent-header">
                <div class="photo-section">
                    <div class="photo-container" id="photo-container">
                        <img id="photo_preview" src="" alt="Photo Véhicule" class="agent-photo">
                        <div class="photo-overlay" id="photo-overlay">
                            <span class="material-symbols-rounded">edit</span>
                        </div>
                    </div>
                </div>
                <div class="agent-info">
                    <h1 id="vehicule-name" class="agent-title">Véhicule</h1>
                    <div class="agent-meta">
                        <span class="plaque-display" id="vehicule-plaque">ABC-1234</span>
                        <span class="badge" id="vehicule-mandat">Chargement...</span>
                        <span class="agent-id" id="vehicule_id">ID: Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Formulaire principal -->
            <form id="profileForm" class="profile-form">
                <!-- Section Informations du véhicule -->
                <div class="form-section">
                    <h3 class="section-title">
                        <span class="material-symbols-rounded">directions_car</span>
                        Informations du véhicule
                    </h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="modele">Modèle</label>
                            <input type="text" id="modele" placeholder="Tesla Model S" required>
                        </div>
                        <div class="form-group">
                            <label for="plaque">Plaque d'immatriculation</label>
                            <input type="text" id="plaque" placeholder="ABC-1234" required
                                style="text-transform: uppercase;">
                        </div>
                        <div class="form-group">
                            <label for="couleur">Couleur</label>
                            <input type="text" id="couleur" placeholder="Noir métallisé">
                        </div>
                        <div class="form-group">
                            <label for="mandat_actif">Mandat actif</label>
                            <select id="mandat_actif">
                                <option value="false">Non</option>
                                <option value="true">Oui</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Section Propriétaire -->
                <div class="form-section">
                    <h3 class="section-title">
                        <span class="material-symbols-rounded">person</span>
                        Propriétaire
                    </h3>
                    <div class="form-row">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="proprietaire">Citoyen propriétaire</label>
                            <div class="proprietaire-selector">
                                <input type="text" id="proprietaire" readonly
                                    placeholder="Aucun propriétaire sélectionné">
                                <input type="hidden" id="proprietaire_id">
                                <button type="button" id="selectProprietaireBtn">Choisir</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section Notes -->
                <div class="form-section">
                    <h3 class="section-title">
                        <span class="material-symbols-rounded">note</span>
                        Notes internes
                    </h3>
                    <div class="notes-section">
                        <textarea id="notes" placeholder="Ajoutez des notes sur ce véhicule..."></textarea>
                    </div>
                </div>

                <!-- Section Rapports -->
                <div class="form-section">
                    <h3 class="section-title">
                        <span class="material-symbols-rounded">description</span>
                        Rapports liés
                    </h3>
                    <div class="rapports-section">
                        <div id="rapportsList">
                            <div class="no-rapports">Aucun rapport disponible pour le moment</div>
                        </div>
                    </div>
                </div>

                <!-- Section Informations système -->
                <div class="form-section">
                    <h3 class="section-title">
                        <span class="material-symbols-rounded">info</span>
                        Informations système
                    </h3>
                    <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group">
                            <label>Créé par</label>
                            <div id="created_by" style="color: #000000; font-size: 15px; padding: 12px 0;">-</div>
                        </div>
                        <div class="form-group">
                            <label>Dernière modification</label>
                            <div id="date_modification" style="color: #000000; font-size: 15px; padding: 12px 0;">-
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Boutons d'action -->
                <div class="action-buttons">
                    <button type="button" id="edit-mode-btn" class="btn btn-warning" style="display: none;">
                        <span class="material-symbols-rounded">edit</span>
                        Modifier le véhicule
                    </button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary" style="display: none;">
                        <span class="material-symbols-rounded">close</span>
                        Annuler
                    </button>
                    <button type="submit" id="save-btn" class="btn btn-primary" style="display: none;">
                        <span class="material-symbols-rounded">save</span>
                        Enregistrer
                    </button>
                    <button type="button" id="delete-btn" class="btn btn-danger" style="display: none;">
                        <span class="material-symbols-rounded">delete</span>
                        Supprimer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>

    <!-- Modal pour modifier la photo -->
    <div id="photoModal" class="photo-modal" style="display: none;">
        <div class="photo-modal-content">
            <h3>Modifier la photo</h3>
            <input type="url" id="photoUrlInput" placeholder="https://cdn.discordapp.com/attachments/...">
            <div class="photo-preview-container" style="margin: 15px 0;">
                <img id="photoPreviewModal" src="" alt="Aperçu"
                    style="max-width: 100%; max-height: 300px; display: none; border-radius: 8px;">
            </div>
            <div class="photo-modal-actions">
                <button type="button" class="btn-cancel" id="cancelPhotoBtn">Annuler</button>
                <button type="button" class="btn-confirm" id="savePhotoBtn">Confirmer</button>
            </div>
        </div>
    </div>

    <script src="scripts/custom-notifications.js"></script>
    <script src="scripts/citoyen-selector.js"></script>
    <script src="scripts/view-vehicule.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script>
        document.getElementById('backlinkBtn').addEventListener('click', () => {
            window.history.back();
        });
    </script>
</body>

</html>
