<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin abscences - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/checkmark.css">
    <link rel="stylesheet" href="styles/warning.css">
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/admin/admin-absences.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">

        <div id="sidebar-container"></div>
        <h1>Pannel des abscences</h1>
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>

        <header class="header">
            <div class="header-left">
                <img src="data/images/lspd.png" alt="LSPD Logo" class="logo">
                <div class="header-title">
                    <p>Gestion et suivi des demandes d'absence</p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-secondary" onclick="window.location.href='/absence'">
                    Nouvelle Absence
                </button>
                <button class="btn-primary" onclick="refreshData()">
                    Actualiser
                </button>
            </div>
        </header>

        <section class="stats-section">
            <h2>Statistiques (30 derniers jours)</h2>
            <div class="stats-grid">
                <div class="stat-card total">
                    <div class="stat-icon"></div>
                    <div class="stat-content">
                        <div class="stat-number" id="total-absences">0</div>
                        <div class="stat-label">Total demandes</div>
                    </div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-icon"></div>
                    <div class="stat-content">
                        <div class="stat-number" id="pending-absences">0</div>
                        <div class="stat-label">En attente</div>
                    </div>
                </div>
                <div class="stat-card approved">
                    <div class="stat-icon"></div>
                    <div class="stat-content">
                        <div class="stat-number" id="approved-absences">0</div>
                        <div class="stat-label">Approuvées</div>
                    </div>
                </div>
                <div class="stat-card rejected">
                    <div class="stat-icon"></div>
                    <div class="stat-content">
                        <div class="stat-number" id="rejected-absences">0</div>
                        <div class="stat-label">Refusées</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="filters-section">
            <div class="filters-container">
                <div class="filter-group">
                    <label for="filter-status">Statut:</label>
                    <select id="filter-status">
                        <option value="">Tous</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-type">Type:</label>
                    <select id="filter-type">
                        <option value="">Tous</option>
                        <option value="maladie">Maladie</option>
                        <option value="formation">Formation</option>
                        <option value="personnel">Personnel</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-date-start">Du:</label>
                    <input type="date" id="filter-date-start">
                </div>
                <div class="filter-group">
                    <label for="filter-date-end">Au:</label>
                    <input type="date" id="filter-date-end">
                </div>
                <button class="btn-filter" onclick="applyFilters()">Filtrer</button>
                <button class="btn-clear" onclick="clearFilters()">Effacer</button>
            </div>
        </section>

        <section class="calendar-section">
            <div class="calendar-header">
                <h2>Calendrier des Absences</h2>
                <div class="calendar-nav">
                    <button class="btn-nav" onclick="previousMonth()">‹</button>
                    <span id="current-month-year"></span>
                    <button class="btn-nav" onclick="nextMonth()">›</button>
                </div>
            </div>
            <div id="calendar-grid" class="calendar-grid">

            </div>
            <div class="calendar-legend">
                <div class="legend-item">
                    <span class="color-box red"></span>
                    <span>Maladie</span>
                </div>
                <div class="legend-item">
                    <span class="color-box orange"></span>
                    <span>Personnel</span>
                </div>
                <div class="legend-item">
                    <span class="color-box green"></span>
                    <span>Formation</span>
                </div>
        </section>

        <section class="requests-section">
            <div class="section-header">
                <h2>Demandes d'Absence</h2>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Rechercher par nom, badge...">
                    <button class="btn-search" onclick="searchRequests()">🔍</button>
                </div>
            </div>
            <div class="requests-container">
                <div id="requests-list">
                </div>
            </div>
        </section>
    </div>

    <div id="absence-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Détails de l'absence</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modal-body">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Fermer</button>
                <button class="btn-success" onclick="approveAbsence()">✅ Approuver</button>
                <button class="btn-danger" onclick="rejectAbsence()">❌ Refuser</button>
            </div>
        </div>
    </div>

    <div id="comment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="comment-modal-title">Ajouter un commentaire</h3>
                <span class="close" onclick="closeCommentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="admin-comment">Commentaire (optionnel):</label>
                    <textarea id="admin-comment" rows="4" placeholder="Votre commentaire..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeCommentModal()">Annuler</button>
                <button class="btn-primary" onclick="confirmStatusChange()">Confirmer</button>
            </div>
        </div>
    </div>
    </div>
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>
    <script src="scripts/absence/admin-absences.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script src="scripts/instant-sidebar.js"></script>
    <script src="scripts/liveUserHeartbeat.js"></script>
</body>

</html>
