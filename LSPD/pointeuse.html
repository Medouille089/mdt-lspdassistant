<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pointeuse - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/dashboard/dashboard.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <!-- pointeuse styles are under styles/outils/ -->
    <!-- removed incorrect top-level styles/pointeuse.css to avoid 404s -->
    <link rel="stylesheet" href="styles/popup.css" />
    <link rel="stylesheet" href="styles/warning.css" />
    <link rel="stylesheet" href="styles/checkmark.css" />
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/outils/pointeuse.css" />
    <link rel="stylesheet" href="styles/context-menu.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container pointeuse">
        <div id="sidebar-container"></div>
        <script src="scripts/instant-sidebar.js"></script>
        <h1>Pointeuse LSPD</h1>

        <div class="dashboard-container">
            <!-- Bandeau supérieur avec 2 cartes -->
            <div class="stats-cards">
                <!-- Salaire de la semaine -->
                <div class="card stat" id="weeklySalaryCard">
                    <div class="title">Salaire de la semaine</div>
                    <div class="number" id="current-week-total">Chargement...</div>
                </div>
                <!-- Semaine + Statut + Bouton -->
                <div class="card stat" id="weekRangeCard">
                    <div class="title">Semaine du <span class="range-date" id="current-week-range">Chargement...</span></div>
                    <div class="info" id="status">Chargement du statut...</div>
                    <button id="btn-start-stop" style="margin-top: 10px;">...</button>
                </div>
            </div>

            <!-- Sessions (Semaine en cours) -->
            <h2>Sessions</h2>
            <div class="card full-width" style="background-color: white !important;">
                <table>
                    <thead>
                        <tr>
                            <th>Début</th>
                            <th>Fin</th>
                            <th>Rôle</th>
                            <th>Durée (h)</th>
                            <th>Gains ($)</th>
                        </tr>
                    </thead>
                    <tbody id="weekly-history-body">
                        <tr>
                            <td colspan="5">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Graphique mensuel -->
            <h2>Activité du mois</h2>
            <div class="card full-width">
                <canvas id="monthlyChart" height="120"></canvas>
            </div>

            <!-- Historique (3 dernières semaines) -->
            <h2>Historique</h2>
            <div class="stats-cards" id="last-weeks-cards">
                <div class="card stat">
                    <div class="title">Semaine du</div>
                    <div class="number">Chargement...</div>
                    <div class="info">—</div>
                </div>
            </div>
        </div>
    </div>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>
    <div id="customConfirmSend" class="custom-confirm-overlay" style="display:none;">
        <div class="custom-confirm-box">
            <p>Confirmer l'envoi de cette sanction ?</p>
            <div class="custom-confirm-buttons">
                <button class="btn btn-blue">Annuler</button>
                <button class="btn btn-red">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="feedbackAnimation" style="display: none; text-align: center;"></div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts/pointeuse.js"></script>
    <script src="scripts/context-menu.js"></script>
</body>

</html>
