<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Profil Arme - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/infosagent.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/custom-notifications.css" />
    <link rel="stylesheet" href="styles/citoyen-selector.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="styles/view-arme.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/context-menu.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>
    <div class="main-container">
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour"><span class="material-symbols-rounded">arrow_back</span> Retour</button>
        <div class="agent-profile-container">
            <div class="agent-header">
                <div class="photo-section">
                    <div class="photo-container" id="photo-container">
                        <img id="photo_preview" src="" alt="Photo Arme" class="agent-photo">
                        <div class="photo-overlay" id="photo-overlay">
                            <span class="material-symbols-rounded">edit</span>
                        </div>
                    </div>
                </div>
                <div class="agent-info">
                    <h1 id="arme-name" class="agent-title">Nom arme</h1>
                    <div class="agent-meta">
                        <span class="serial-display" id="arme-serial">SN-123456</span>
                        <span class="agent-id" id="arme_id">ID: Loading...</span>
                    </div>
                </div>
            </div>
            <form id="profileForm" class="profile-form">
                <div class="form-section">
                    <h3 class="section-title"><span class="material-symbols-rounded">gavel</span> Informations de l'arme
                    </h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="modele">Modèle</label>
                            <input type="text" id="modele" placeholder="Glock 17" required>
                        </div>
                        <div class="form-group">
                            <label for="serial_number">Numéro de série</label>
                            <input type="text" id="serial_number" placeholder="SN-123456" required
                                style="font-family: Consolas, monospace;">
                        </div>
                        <div class="form-group">
                            <label for="calibre">Calibre</label>
                            <input type="text" id="calibre" placeholder="9mm">
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="section-title"><span class="material-symbols-rounded">person</span> Propriétaire</h3>
                    <div class="form-row">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="proprietaire">Citoyen propriétaire</label>
                            <div class="proprietaire-selector">
                                <input type="text" id="proprietaire" readonly
                                    placeholder="Aucun propriétaire sélectionné">
                                <input type="hidden" id="proprietaire_id">
                                <button type="button" id="selectProprietaireBtn">Choisir</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="section-title"><span class="material-symbols-rounded">note</span> Notes internes</h3>
                    <div class="notes-section">
                        <textarea id="notes" placeholder="Ajoutez des notes sur cette arme..."></textarea>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="section-title"><span class="material-symbols-rounded">description</span> Rapports liés
                    </h3>
                    <div class="rapports-section">
                        <div id="rapportsList">
                            <div class="no-rapports">Aucun rapport disponible pour le moment</div>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="section-title"><span class="material-symbols-rounded">info</span> Informations système
                    </h3>
                    <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group">
                            <label>Créé par</label>
                            <div id="created_by" style="color: #000000; font-size: 15px; padding: 12px 0;">-</div>
                        </div>
                        <div class="form-group">
                            <label>Dernière modification</label>
                            <div id="date_modification" style="color: #000000; font-size: 15px; padding: 12px 0;">-
                            </div>
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="button" id="edit-mode-btn" class="btn btn-warning" style="display: none;"><span
                            class="material-symbols-rounded">edit</span> Modifier l'arme</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary" style="display: none;"><span
                            class="material-symbols-rounded">close</span> Annuler</button>
                    <button type="submit" id="save-btn" class="btn btn-primary" style="display: none;"><span
                            class="material-symbols-rounded">save</span> Enregistrer</button>
                    <button type="button" id="delete-btn" class="btn btn-danger" style="display: none;"><span
                            class="material-symbols-rounded">delete</span> Supprimer</button>
                </div>
            </form>
        </div>
    </div>
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>
    <div id="photoModal" class="photo-modal" style="display: none;">
        <div class="photo-modal-content">
            <h3>Modifier la photo</h3>
            <input type="url" id="photoUrlInput" placeholder="https://cdn.discordapp.com/attachments/...">
            <div class="photo-preview-container" style="margin: 15px 0;">
                <img id="photoPreviewModal" src="" alt="Aperçu"
                    style="max-width: 100%; max-height: 300px; display: none; border-radius: 8px;">
            </div>
            <div class="photo-modal-actions">
                <button type="button" class="btn-cancel" id="cancelPhotoBtn">Annuler</button>
                <button type="button" class="btn-confirm" id="savePhotoBtn">Confirmer</button>
            </div>
        </div>
    </div>
    <script src="scripts/custom-notifications.js"></script>
    <script src="scripts/citoyen-selector.js"></script>
    <script src="scripts/view-arme.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script>
        document.getElementById('backlinkBtn').addEventListener('click', () => {
            window.history.back();
        });
    </script>
</body>

</html>
