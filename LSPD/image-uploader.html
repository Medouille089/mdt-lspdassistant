<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Uploader d'images - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/dashboard.css" />
    <link rel="stylesheet" href="styles/checkmark.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <link rel="stylesheet" href="styles/confirm.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/warningCancer.css" />
    <link rel="stylesheet" href="styles/uploader.css" />
</head>

<body>

    <div class="main-container">
        <div id="sidebar-container"></div>
            <h1 class="uploader-title" style="margin-top: 32px;">Uploader d'images</h1>
            <a class="backlink-btn" href="/">← Retour</a>

        <div class="center-wrap">

            <div class="uploader-panel">

            <div class="uploader-row">
                <label for="channelSelect">Salon Discord :</label>
                <!-- Custom select -->
                <div class="custom-select" id="channelSelectCustom">
                    <button class="cs-trigger" id="csTrigger">Chargement...</button>
                    <div class="cs-options" id="csOptions" aria-hidden="true"></div>
                </div>
            </div>

            <div class="uploader-row uploader-actions">
                <input id="files" type="file" multiple accept="image/*" class="file-input" />
                <label for="files" class="file-label">Choisir des images</label>
                <span class="file-info" id="fileInfo">Aucun fichier sélectionné</span>
            </div>

            <div class="preview" id="preview"></div>
            <div class="uploader-row button-row" style="margin-top:30px">
                <button id="uploadBtn" class="backlink-btn primary">Uploader</button>
            </div>

            <div class="urls" id="urls"></div>
            </div>
        </div>

    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script>
        (function(){
            const GUILD_ID = '1427300258089533573';
            const csTrigger = document.getElementById('csTrigger');
            const csOptions = document.getElementById('csOptions');
            const filesInput = document.getElementById('files');
            const uploadBtn = document.getElementById('uploadBtn');
            const preview = document.getElementById('preview');
            const urlsDiv = document.getElementById('urls');

            let channels = [];
            let selectedChannelId = null;
            let optionNodes = [];
            let open = false;

            function closeOptions(){
                csOptions.style.display = 'none';
                csOptions.setAttribute('aria-hidden','true');
                open = false;
            }
            function openOptions(){
                csOptions.style.display = 'block';
                csOptions.setAttribute('aria-hidden','false');
                open = true;
            }

            function setSelected(id, name){
                selectedChannelId = id;
                csTrigger.textContent = name;
                // mark selected option
                optionNodes.forEach(n => n.classList.toggle('selected', n.dataset.id === String(id)));
            }

            async function loadChannels(){
                csTrigger.textContent = 'Chargement...';
                csOptions.innerHTML = '';
                try{
                    const res = await fetch(`/api/discord/channels?guild_id=${GUILD_ID}`);
                    const data = await res.json();
                    channels = data.channels || [];
                    // expose globally for refresh button logic
                    window.channels = channels;
                    if(!channels.length){
                        csTrigger.textContent = 'Aucun salon';
                        return;
                    }

                    // Build options
                    optionNodes = channels.map(ch => {
                        const d = document.createElement('div');
                        d.className = 'cs-option';
                        d.tabIndex = 0;
                        d.dataset.id = ch.id;
                        d.textContent = ch.name;
                        d.addEventListener('click', () => { setSelected(ch.id, ch.name); closeOptions(); });
                        d.addEventListener('keydown', (e) => {
                            if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); d.click(); }
                        });
                        csOptions.appendChild(d);
                        return d;
                    });

                    // Default select first
                    if(channels[0]) setSelected(channels[0].id, channels[0].name);
                    csTrigger.textContent = channels[0].name;
                }catch(e){
                    csTrigger.textContent = 'Erreur';
                    console.error(e);
                }
            }

            // Trigger behavior
            csTrigger.addEventListener('click', (e)=>{
                e.stopPropagation();
                if(open) closeOptions(); else openOptions();
            });

            // Close when clicking outside
            document.addEventListener('click', (e)=>{ if(open) closeOptions(); });

            function humanFileSize(size){
                const i = size === 0 ? 0 : Math.floor(Math.log(size) / Math.log(1024));
                return (size / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ['B','KB','MB','GB','TB'][i];
            }

            filesInput.addEventListener('change', ()=>{
                preview.innerHTML = '';
                const files = filesInput.files;
                const info = document.getElementById('fileInfo');
                if(!files.length){ info.textContent = 'Aucun fichier sélectionné'; return; }
                info.textContent = `${files.length} fichier(s)`;
                let total = 0;
                for(const f of files){
                    total += f.size;
                    const wrap = document.createElement('div');
                    wrap.className = 'thumb';
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(f);
                    img.title = f.name;
                    // click to open modal
                    img.addEventListener('click', ()=> openImageModal(img.src, img.title));
                    wrap.appendChild(img);
                    preview.appendChild(wrap);
                }
                info.textContent = `${files.length} fichier(s) • ${humanFileSize(total)}`;
            });

            function openImageModal(src, title){
                // create modal
                const modal = document.createElement('div'); modal.className = 'img-modal';
                const wrap = document.createElement('div'); wrap.className = 'img-wrap';
                const img = document.createElement('img'); img.src = src; img.alt = title || '';
                const closeBtn = document.createElement('div'); closeBtn.className = 'close-btn';
                closeBtn.addEventListener('click', () => { document.body.removeChild(modal); });
                modal.addEventListener('click', (e)=>{ if(e.target === modal) document.body.removeChild(modal); });
                document.addEventListener('keydown', function escListener(e){ if(e.key === 'Escape'){ if(document.body.contains(modal)) document.body.removeChild(modal); document.removeEventListener('keydown', escListener); } });
                wrap.appendChild(img); wrap.appendChild(closeBtn); modal.appendChild(wrap); document.body.appendChild(modal);
            }

            uploadBtn.addEventListener('click', async ()=>{
                const channelId = selectedChannelId;
                const files = filesInput.files;
                if(!channelId){ alert('Choisissez un salon'); return; }
                if(!files.length){ alert('Choisissez au moins une image'); return; }

                const form = new FormData();
                form.append('channel_id', channelId);
                for(const f of files){ form.append('files', f, f.name); }

                uploadBtn.disabled = true; uploadBtn.textContent = 'Uploading...';
                urlsDiv.innerHTML = '';
                try{
                    const res = await fetch('/api/discord/upload', { method: 'POST', body: form });
                    const data = await res.json();
                    if(data.uploaded){
                        for(const u of data.uploaded){
                            const item = document.createElement('div');
                            item.className = 'url-item';
                            const title = document.createElement('strong');
                            title.textContent = u.name;
                            item.appendChild(title);
                            if(u.urls && u.urls.length){
                                u.urls.forEach((link, idx) => {
                                    const row = document.createElement('div');
                                    row.className = 'url-row';
                                    const a = document.createElement('a');
                                    a.href = link; a.target = '_blank'; a.textContent = link; a.className = 'url-link';
                                    row.appendChild(a);

                                    const copyBtn = document.createElement('button');
                                    copyBtn.className = 'copy-btn';
                                    copyBtn.type = 'button';
                                    copyBtn.title = 'Copier le lien';
                                    copyBtn.textContent = 'Copier';
                                    copyBtn.addEventListener('click', async () => {
                                        try{
                                            if(navigator.clipboard && navigator.clipboard.writeText){
                                                await navigator.clipboard.writeText(link);
                                            } else {
                                                const ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
                                            }
                                            copyBtn.classList.add('copied');
                                            setTimeout(()=> copyBtn.classList.remove('copied'), 2000);
                                        }catch(e){
                                            console.error('Copy failed', e);
                                        }
                                    });

                                    row.appendChild(copyBtn);
                                    item.appendChild(row);
                                });
                            } else {
                                const err = document.createElement('div'); err.textContent = u.error || 'Erreur'; item.appendChild(err);
                            }
                            urlsDiv.appendChild(item);
                        }

                        // Après affichage des liens : masquer le select de salon, le texte label, le sélecteur de fichiers et le bouton d'upload
                        const cs = document.getElementById('channelSelectCustom');
                        const fileRow = document.querySelector('.uploader-row.uploader-actions');
                        const btnRow = document.querySelector('.uploader-row.button-row');
                        const salonLabel = document.querySelector('label[for="channelSelect"]');
                        if(cs) cs.style.display = 'none';
                        if(salonLabel) salonLabel.style.display = 'none';
                        if(fileRow) fileRow.style.display = 'none';
                        if(btnRow) btnRow.style.display = 'none';

                        // Ajouter un bouton "Rafraîchir" sous les liens
                        const refreshBtn = document.createElement('button');
                        refreshBtn.id = 'refreshBtn';
                        refreshBtn.className = 'backlink-btn primary';
                        refreshBtn.textContent = 'Rafraîchir';
                        // center and add top margin
                        refreshBtn.style.display = 'block';
                        refreshBtn.style.margin = '16px auto 0';
                        refreshBtn.addEventListener('click', () => {
                            // Restaurer l'UI
                            if(cs) cs.style.display = '';
                            if(salonLabel) salonLabel.style.display = '';
                            if(fileRow) fileRow.style.display = '';
                            if(btnRow) btnRow.style.display = '';
                            // Clear files and previews
                            filesInput.value = '';
                            preview.innerHTML = '';
                            urlsDiv.innerHTML = '';
                            const info = document.getElementById('fileInfo'); if(info) info.textContent = 'Aucun fichier sélectionné';
                            // Reset selected channel to first available
                            if(window.channels && window.channels.length){
                                const first = window.channels[0];
                                selectedChannelId = first.id;
                                csTrigger.textContent = first.name;
                            } else {
                                // reload channel list
                                loadChannels();
                            }
                            // retirer le bouton refresh
                            if(refreshBtn && refreshBtn.parentNode) refreshBtn.parentNode.removeChild(refreshBtn);
                        });

                        const refreshRow = document.createElement('div');
                        refreshRow.className = 'refresh-row';
                        refreshRow.appendChild(refreshBtn);
                        // append the refresh row after the urlsDiv to avoid styling conflicts
                        if(urlsDiv && urlsDiv.parentNode){
                            urlsDiv.parentNode.insertBefore(refreshRow, urlsDiv.nextSibling);
                        } else {
                            urlsDiv.appendChild(refreshRow);
                        }
                    } else if(data.error){
                        urlsDiv.textContent = data.error;
                    }
                }catch(e){
                    console.error(e);
                    urlsDiv.textContent = 'Erreur de communication';
                } finally{
                    uploadBtn.disabled = false; uploadBtn.textContent = 'Uploader';
                }
            });

            // close on escape key
            document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeOptions(); });

            loadChannels();
        })();
    </script>

    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/loadSidebar.js"></script>
</body>

</html>
