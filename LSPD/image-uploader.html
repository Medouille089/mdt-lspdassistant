<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Fiche cérémonie - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            z-index: 0;
            background: none;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: var(--background-gradient);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .annexe-wrapper {
            display: flex;
            flex-direction: column;
        }

        .annexe-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .annexe-toolbar .open-external {
            background: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            margin-top: -32px;
        }

        .annexe-toolbar .open-external:hover {
            background: var(--button-bg-hover);
        }

        .annexe-frame {
            width: 125%; /* 1/0.8 = 1.25 pour compenser le scale */
            height: calc((100vh - 180px) / 0.8);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: #fff;
            transform: scale(0.8);
            transform-origin: 0 0;
        }

        .annexe-warning {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div id="sidebar-container"></div>    <script src="scripts/instant-sidebar.js"></script>
        <h1>Uploader d'images</h1>
        <div class="annexe-wrapper">
            <div id="annexeInfo" class="annexe-warning" aria-live="polite" style="display: none !important;"></div>
            <iframe id="annexFrame" class="annexe-frame" referrerpolicy="no-referrer"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                src="https://files.fantasticrp.fr/"></iframe>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>

    <script>
        document.getElementById('openExternal').onclick = function () {
            window.open('https://files.fantasticrp.fr/', '_blank');
        };
    </script>
</body>

</html>
