<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Panel Tickets - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/checkmark.css">
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/warning.css">
    <link rel="stylesheet" href="styles/popup.css">
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <link rel="stylesheet" href="styles/admin/tickets.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
</head>

<body>
    <div class="main-container">
        <div id="sidebar-container"></div>
        <h1>Panel tickets</h1>
        <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">
            ← Retour
        </button>
        <div class="warning-modern">
            <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
                class="warning-icon-modern">
            <span>Merci de demander l'accord de 52 ou de 59 avant toutes modifications</span>
            <img src="https://fonts.gstatic.com/s/i/materialiconsoutlined/warning_amber/v15/24px.svg" alt="warning icon"
                class="warning-icon-modern">
        </div>
        <div class="incident-container">
            <div class="header">
            </div>

            <h2>Créer un panel</h2>
                <div class="panel-row panel-row--three">
                    <div class="field">
                        <label for="embedTitle">Titre du selecteur</label>
                        <input type="text" id="embedTitle" placeholder="Titre de l'embed">
                    </div>
                    <div class="field">
                        <label for="panelChannel">Catégorie / Salon</label>
                        <select id="panelChannel"></select>
                    </div>
                    <div class="field">
                        <label for="panelEmbedColor">Couleur de l'embed</label>
                        <input type="color" id="panelEmbedColor" value="#0b1b5a">
                    </div>
                </div>
                <label>Description du selecteur</label>
                <textarea id="embedDescription" placeholder="Description"></textarea>

            <hr>

            <div style="display:flex;justify-content:flex-end; margin-bottom:14px;">
                <button id="openCreateModal" class="btn btn-primary">Ajouter catégorie</button>
            </div>
            <h2>Catégories de tickets</h2>
            <div id="categoriesContainer"></div>

            <div class="button-container">
                <button id="sendPanel" class="send-button">Envoyer le panel sur Discord</button>
            </div>
        </div>
    </div>
    <!-- Single reusable confirm modal -->
    <div id="customConfirm" class="custom-confirm-overlay" style="display:none;">
        <div class="custom-confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <p id="confirmMessage">Confirmer l'opération ?</p>
            <div class="custom-confirm-buttons">
                <button id="confirmCancelBtn" class="btn btn-blue">Annuler</button>
                <button id="confirmOkBtn" class="btn btn-red">Confirmer</button>
            </div>
        </div>
    </div>

    <!-- Edit category modal (popup) -->
    <div id="editCategoryModal" class="custom-confirm-overlay" style="display:none;">
        <div class="custom-confirm-box modal-card" role="dialog" aria-modal="true" aria-labelledby="editCategoryTitle">
            <div class="modal-header">
                <h3 id="editCategoryTitle">Modifier la catégorie</h3>
                <button id="editCancelBtn" type="button" class="btn btn-icon" aria-label="Fermer">✕</button>
            </div>

            <form id="editCategoryForm">
                <div class="modal-row modal-row--four">
                    <div class="field">
                        <label for="edit_title">Titre</label>
                        <input id="edit_title" name="title" type="text" required />
                    </div>
                    <div class="field">
                        <label for="edit_emoji">Emoji</label>
                        <input id="edit_emoji" name="emoji" type="text" required />
                    </div>
                    <div class="field">
                        <label for="edit_prefix">Préfix</label>
                        <input id="edit_prefix" name="prefix" type="text" />
                    </div>
                    <div class="field">
                        <label for="edit_categoryEmbedColor">Couleur</label>
                        <input id="edit_categoryEmbedColor" name="embed_color" type="color" value="#0b1b5a" />
                    </div>
                </div>

                <div class="modal-row">
                    <div class="field">
                            <label for="edit_targetCategorySelect">Catégorie cible</label>
                            <select id="edit_targetCategorySelect" name="target_channel_id"></select>
                        </div>
                </div>

                <div class="modal-row">
                    <div class="field">
                        <label for="edit_description">Description</label>
                        <textarea id="edit_description" name="description"></textarea>
                    </div>
                </div>

                <div class="modal-row">
                    <div class="field">
                        <label for="edit_welcomeMessage">Message de bienvenue</label>
                        <textarea id="edit_welcomeMessage" name="welcome_message"></textarea>
                    </div>
                </div>

                <div class="modal-row">
                    <div class="field">
                        <label for="edit_rolesSelect">Roles (sélectionne pour ajouter)</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <select id="edit_rolesSelect"></select>
                        </div>
                        <div class="roles-list" id="edit_selectedRolesContainer" style="margin-top:8px;"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <label class="switch"><input id="edit_visibleCheckbox" name="visible" type="checkbox" checked> Afficher dans le panel</label>
                    <div class="modal-actions">
                        <button id="editCancelBtnFooter" type="button" class="btn btn-outline">Annuler</button>
                        <button id="editSaveBtn" type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div id="feedbackAnimation" style="display: none; text-align: center;"></div>
    <script src="scripts/ticket.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/annonce-popup.js"></script>
    <script src="scripts/context-menu.js"></script>
</body>

</html>
