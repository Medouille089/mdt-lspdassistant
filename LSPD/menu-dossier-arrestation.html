<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/genMenu.css">
    <title>Dossier d'arrestation - LSPD Assistant</title>
    <style>
        /* Force le bouton retour à gauche pour cette page */
        .backlink-row { display: flex; justify-content: flex-start; }
        .backlink-row .backlink-btn { margin-left: 0 !important; margin-right: auto !important; }
    </style>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>

    <div class="main-container">
        <h1>Dossier d'arrestation</h1>
        <div class="backlink-row">
            <button id="backlinkBtn" class="backlink-btn" type="button" aria-label="Retour">← Retour</button>
        </div>
        <div class="grid-wrapper">
            <div class="button-grid">
                <a href="da-viewer.html?url=https%3A%2F%2Fdocs.google.com%2Fdocument%2Fd%2F19Ds2L-b8rArMByjY0t7Ko2wG5aggCWqhkVnyS50jr7E%2Fedit%3Fusp%3Dsharing"
                    class="send-button">Dossier d'arrestation</a>
                <a href="da-viewer.html?url=https%3A%2F%2Fdocs.google.com%2Fdocument%2Fd%2F1a0hWw0FDSDkvo5gBxwjdo7hK6ygESVgrwAAZikKT2Fk%2Fedit%3Fusp%3Dsharing"
                    class="send-button">Aide dossier d'arrestation</a>
            </div>
        </div>
    </div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/genMenu.js"></script>
    <script>
        (function () {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function init() {
                const btn = document.getElementById('backlinkBtn');
                if (!btn) return;

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'liste-incidents.html';
                    }
                });
            }
        })();
    </script>
</body>

</html>
