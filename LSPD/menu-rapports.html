<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/admin/admin.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/checkmark.css">
    <link rel="stylesheet" href="styles/warning.css">
    <link rel="stylesheet" href="styles/genMenu.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Nouveau rapport - LSPD Assistant</title>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>Nouveau rapport</h1>

        <div class="grid-wrapper">
            <div class="button-grid">
                <a href="/incident" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="alert-triangle" class="icon"></i></div>
                    <span class="label">Incident</span>
                </a>
                <a href="/dossier-arrestation" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="user-x" class="icon"></i></div>
                    <span class="label">D.A</span>
                </a>
                <a href="/bracelet" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="watch" class="icon"></i></div>
                    <span class="label">Bracelet</span>
                </a>
                <a href="/convocation" class="send-button">
                    <div class="icon-wrapper"><i data-lucide="mail" class="icon"></i></div>
                    <span class="label">Convocation</span>
                </a>
                <a href="/rapport-rookie" class="send-button hidden">
                    <div class="icon-wrapper"><i data-lucide="graduation-cap" class="icon"></i></div>
                    <span class="label">Rookie</span>
                </a>
                <!-- <a href="/rapport-arrestation" class="send-button" >
                    <div class="icon-wrapper"><i data-lucide="file-text" class="icon"></i></div>
                    <span class="label">Rapport d'arrestation</span>
                </a>
                <a href="/liste-rapports-arrestation" class="send-button" >
                    <div class="icon-wrapper"><i data-lucide="list" class="icon"></i></div>
                    <span class="label">Liste Rapports</span>
                </a> -->
            </div>
        </div>
    </div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/genMenu.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
