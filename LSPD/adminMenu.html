<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <title>Grille de Boutons</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            z-index: 0;
            background: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: linear-gradient(#F1F3FF, #CBD4FF);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .main-container {
            min-height: 100vh;
            padding: 40px 20px 20px;
            box-sizing: border-box;
            text-align: center;
            display: block;
            /* PAS de flex ici */
        }

        .grid-wrapper {
            height: calc(90vh - 120px);
            /* espace sous le h1 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            /* max 3 colonnes si assez d’espace */
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .send-button {
            background-color: #0b1b5a;
            color: white;
            border: none;
            padding: 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            width: 100%;
            box-shadow: 0 8px 16px rgba(11, 27, 90, 0.2);
        }

        .send-button:hover {
            background-color: #091447;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(11, 27, 90, 0.3);
        }
    </style>
</head>

<body>
    <div id="sidebar-container"></div>

    <div class="main-container">
        <h1>Menu admin</h1>

        <div class="grid-wrapper">
            <div class="button-grid">
                <a href="admin.html" class="send-button">Salons</a>
                <a href="adminPointeuse.html" class="send-button">Pointeuse</a>
                <a href="#" class="send-button">Bouton 3</a>
                <a href="#" class="send-button">Bouton 4</a>
                <a href="#" class="send-button">Bouton 5</a>
                <a href="#" class="send-button">Bouton 6</a>
                <a href="#" class="send-button">Bouton 7</a>
                <a href="#" class="send-button">Bouton 8</a>
                <a href="#" class="send-button">Bouton 9</a>
            </div>
        </div>
    </div>

    <script src="scripts/loadSidebar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.send-button').forEach(btn => {
                if (btn.getAttribute('href') === '#') {
                    btn.remove();
                }
            });
        });
    </script>

</body>

</html>
