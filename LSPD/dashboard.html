<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Tableau de bord - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/loader.css" />
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/warningCancer.css" />
    <link rel="stylesheet" href="styles/dashboard/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <!-- Overlay de bienvenue -->
    <div id="overlay">
        <span id="overlayMessage"></span>
        <div id="overlayGrade" style="font-size: 0.5em; font-weight: normal; margin-top: 10px;"></div>
    </div>

    <!-- Élément caché pour affichage utilisateur -->
    <div style="display:none;">
        <span id="messageUsername"></span>
        <span id="messageGrade"></span>
    </div>

    <div class="main-container">
        <div id="sidebar-container"></div>
        <div class="warning-modern">
            <span>🎀 Octobre Rose sur le site, pour soutenir <a target="_blank" href="https://www.cancerdusein.org/81-association/230-faire-un-don">cancerdusein.org</a> ou <a target="_blank" href="https://www.ligue-cancer.net/octobre-rose">ligue-cancer.net</a> 🎀</span>
        </div>
        <h1>Tableau de bord</h1>

        <div class="dashboard-container">
            <!-- Top widgets -->
            <div class="stats-cards">
                <div class="card stat" id="interventionCard">
                    <div class="title">Rapports</div>
                    <div class="number" id="interventionCount">0</div>
                    <div class="info" id="interventionInfo">+0 aujourd'hui</div>
                </div>
                <div class="card stat" id="braceletCard">
                    <div class="title">Bracelets</div>
                    <div class="number blink-red" id="braceletCount">0</div>
                    <div class="info" id="braceletInfo">Actifs</div>
                </div>
                <div class="card stat" id="patrouilleCard">
                    <div class="title">Salaire</div>
                    <div class="number" id="patrouilleCount">0$</div>
                    <div class="info" id="patrouilleInfo">Semaine</div>
                </div>
            </div>

            <!-- Middle section -->
            <div class="middle-section">
                <div class="card chart">
                    <h3>Activité Hebdomadaire</h3>
                    <canvas id="activityChart" height="120"></canvas>
                </div>

                <div class="right-panel">
                    <div class="card profile-summary">
                        <h4>Agents connectés</h4>
                        <ul id="connectedAgentsList" class="connected-agents-list">
                            <!-- Liste dynamique -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Bottom section -->
            <div class="card full-width">
                <h3>Derniers rapports</h3>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Agent</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody id="rapportsTbody">
                        <!-- Rempli dynamiquement -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/dashboard.js"></script>
</body>

</html>
