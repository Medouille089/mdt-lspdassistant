<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Liste des bracelets - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/liste-rapports.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>Liste des bracelets actifs</h1>

        <div class="content-wrapper">
            <div class="controls-container">
                <div class="search-box">
                    <span class="material-symbols-rounded">search</span>
                    <input type="text" id="searchInput" placeholder="Rechercher" autocomplete="off" />
                </div>
                <div class="filters">
                    <input type="date" id="dateStart" />
                    <input type="date" id="dateEnd" />
                </div>
            </div>

            <div class="table-container">
                <table id="braceletTable" aria-label="Liste des bracelets">
                    <thead>
                        <tr>
                            <th>ID Bracelet</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Date d'activation</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dynamique -->
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script src="scripts/bracelet/getBracelet.js"></script>
</body>

</html>
