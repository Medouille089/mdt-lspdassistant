<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Liste Bracelets - Maître</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/bracelet/getBracelet.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
</head>

<body>
    <div class="main-container">

        <div id="sidebar-container"></div>
        <h1>Liste des breacelets actifs</h1>
        <div class="container">
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Recherche par ID, nom, prénom..." autocomplete="off" />
                <input type="date" id="dateStart" />
                <input type="date" id="dateEnd" />
            </div>

            <table id="braceletTable" aria-label="Liste des bracelets">
                <thead>
                    <tr>
                        <th>ID Bracelet</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Date début</th>
                        <th>Date fin</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamique -->
                </tbody>
            </table>

            <div class="pagination" id="pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>
    <script src="scripts/bracelet/getBracelet.js"></script>
    <script src="scripts/loadSidebar.js"></script>

</body>

</html>
