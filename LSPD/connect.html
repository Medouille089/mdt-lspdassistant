    <title>Connexion - LSPD Assistant</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Background Slideshow -->
    <div class="background-slideshow" id="backgroundSlideshow"></div>

    <div class="header">
      <img src="data/images/lspd.png" alt="LSPD Logo" class="logo" />
      <div class="slogan">To protect and serve.</div>
    </div>

    <div class="main-content">
      <div class="login-container">
        <!-- Connexion Locale (affichée par défaut) -->
        <div class="local-login-form">
          <div class="error-message" id="errorMessage"></div>

          <form id="localLoginForm">
            <div class="form-group">
              <h2 style="margin: 0 0 20px 0; text-align: center;">LSPD Assistant</h1>
              <label for="username">Nom d'utilisateur</label>
              <input
                type="text"
                id="username"
                name="username"
                required
                placeholder="Votre nom d'utilisateur"
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label for="password">Mot de passe</label>
              <div style="position: relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  placeholder="Votre mot de passe"
                  autocomplete="current-password"
                  style="padding-right: 40px"
                />
                <button
                  type="button"
                  id="togglePassword"
                  aria-label="Afficher le mot de passe"
                  style="
                    position: absolute;
                    right: 8px;
                    top: 50%;
                    transform: translateY(-50%);
                    background: none;
                    border: none;
                    cursor: pointer;
                    padding: 0;
                    color: white;
                  "
                >
                  <span id="eyePassword" class="material-symbols-outlined"
                    >visibility</span
                  >
                </button>
              </div>
            </div>

            <button type="submit" class="login-button" id="loginBtn">
              Se connecter
            </button>
          </form>

          <div class="forgot-password">
            <a href="/forgot-password">Mot de passe oublié ?</a>
          </div>

          <!-- small divider -->
          <hr class="inline-divider" />

          <!-- Discord option placed below the local login -->
          <div class="discord-hint">
            <em>Pas encore d'identifiants?</em>
          </div>
          <div style="margin-top: 10px; text-align: center;">
            <button
              class="connect-button"
              onclick="window.location.href='/login'"
            >
              <img
                src="https://upload.wikimedia.org/wikipedia/fr/thumb/4/4f/Discord_Logo_sans_texte.svg/1818px-Discord_Logo_sans_texte.svg.png"
                alt=""
                style="height:20px; vertical-align:middle; margin-right:8px;"
              />
              Se connecter avec Discord
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="watermark">LSPD Assistant</div>

    <script src="scripts/connect.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script>
      // Background Slideshow - Défilement aléatoire avec fondu
      (function() {
        const backgrounds = [
          'data/images/backgrounds/2.png',
          'data/images/backgrounds/3.png',
          'data/images/backgrounds/4.png',
          'data/images/backgrounds/5.png',
          'data/images/backgrounds/6.png',
          'data/images/backgrounds/7.png',
          'data/images/backgrounds/8.png',
          'data/images/backgrounds/9.png',
          'data/images/backgrounds/10.png',
          'data/images/backgrounds/fond.png',
        ];

        // Mélanger le tableau de manière aléatoire (Fisher-Yates)
        function shuffle(array) {
          const arr = [...array];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        const slideshow = document.getElementById('backgroundSlideshow');
        const shuffledBackgrounds = shuffle(backgrounds);
        let currentIndex = 0;

        // Créer les éléments slide
        shuffledBackgrounds.forEach((bg, index) => {
          const slide = document.createElement('div');
          slide.className = 'slide' + (index === 0 ? ' active' : '');
          slide.style.backgroundImage = `url('${bg}')`;
          slideshow.appendChild(slide);
        });

        const slides = slideshow.querySelectorAll('.slide');

        // Changer de slide toutes les 8 secondes
        setInterval(() => {
          slides[currentIndex].classList.remove('active');
          currentIndex = (currentIndex + 1) % slides.length;
          slides[currentIndex].classList.add('active');
        }, 8000);
      })();
    </script>
  </body>
</html>
