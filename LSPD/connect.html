<!DOCTYPE html>
<html lang="fr">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="data/images/favicon.png" type="image/png" />

    <meta
      name="description"
      content="LSPD Assistant - Plateforme de gestion complète pour le Los Santos Police Department. Gérez vos rapports, absences, sanctions et bien plus encore."
    />
    <meta
      name="keywords"
      content="LSPD, Police, Los Santos, Assistant, Gestion, Rapports"
    />
    <meta name="author" content="LSPD" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lspd-assistant.com/" />
    <meta property="og:title" content="LSPD Assistant - To protect and serve" />
    <meta
      property="og:description"
      content="Plateforme officielle de gestion du Los Santos Police Department. Rapports d'incident, gestion des absences, suivi des sanctions, et bien plus encore."
    />
    <meta
      property="og:image"
      content="https://media.discordapp.net/attachments/1315607319769518202/1425795339604066325/9ABZBFC.png?ex=68e8e2e2&is=68e79162&hm=eb41990737ff8b8c7d80b0c33b479205776f66405dbcbd415545fd12bf6cf891&=&format=webp&quality=lossless&width=630&height=630"
    />
    <meta property="og:image:width" content="630" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lspd-assistant.com/" />
    <meta
      name="twitter:title"
      content="LSPD Assistant - To protect and serve"
    />
    <meta
      name="twitter:description"
      content="Plateforme officielle de gestion du Los Santos Police Department."
    />
    <meta
      name="twitter:image"
      content="https://media.discordapp.net/attachments/1315607319769518202/1425795339604066325/9ABZBFC.png?ex=68e8e2e2&is=68e79162&hm=eb41990737ff8b8c7d80b0c33b479205776f66405dbcbd415545fd12bf6cf891&=&format=webp&quality=lossless&width=630&height=630"
    />

    <meta name="theme-color" content="#0b1b5a" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/connect.css" />

    <title>Connexion - LSPD Assistant</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="header">
      <img src="data/images/lspdcancer.png" alt="LSPD Logo" class="logo" />
      <div class="slogan">To protect and serve.</div>
    </div>

    <div class="main-content">
      <div class="login-container">
        <div class="login-tabs">
          <button class="tab-button active" onclick="switchTab('discord')">
            Discord
          </button>
          <button class="tab-button" onclick="switchTab('local')">
            Compte Local
          </button>
        </div>

        <!-- Connexion Discord -->
        <div id="discord-tab" class="tab-content active">
          <div class="discord-connect-wrapper">
            <button
              class="connect-button"
              onclick="window.location.href='/login'"
            >
              <img
                src="https://upload.wikimedia.org/wikipedia/fr/thumb/4/4f/Discord_Logo_sans_texte.svg/1818px-Discord_Logo_sans_texte.svg.png"
                alt=""
              />Se connecter avec Discord
            </button>
          </div>
        </div>

        <!-- Connexion Locale -->
        <div id="local-tab" class="tab-content">
          <div class="local-login-form">
            <div class="error-message" id="errorMessage"></div>

            <form id="localLoginForm">
              <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  required
                  placeholder="Votre nom d'utilisateur"
                  autocomplete="username"
                />
              </div>

              <div class="form-group">
                <label for="password">Mot de passe</label>
                <div style="position: relative">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Votre mot de passe"
                    autocomplete="current-password"
                    style="padding-right: 40px"
                  />
                  <button
                    type="button"
                    id="togglePassword"
                    aria-label="Afficher le mot de passe"
                    style="
                      position: absolute;
                      right: 8px;
                      top: 50%;
                      transform: translateY(-50%);
                      background: none;
                      border: none;
                      cursor: pointer;
                      padding: 0;
                      color: white;
                    "
                  >
                    <span id="eyePassword" class="material-symbols-outlined"
                      >visibility</span
                    >
                  </button>
                </div>
              </div>

              <button type="submit" class="login-button" id="loginBtn">
                Se connecter
              </button>
            </form>

            <div class="forgot-password">
              <a href="/forgot-password">Mot de passe oublié ?</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="watermark">LSPD Assistant</div>

    <script src="scripts/connect.js"></script>
  </body>
</html>
