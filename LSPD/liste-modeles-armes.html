<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Modèles d'armes - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/bracelet/getBracelet.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/custom-notifications.css" />
    <link rel="stylesheet" href="styles/liste-modeles-armes.css" />
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div class="main-container">
        <div id="sidebar-container"></div>
        <script src="scripts/instant-sidebar.js"></script>
        <h1>Modèles d'armes</h1>

        <div class="container">
            <!-- Statistiques (optionnel) -->
            <div class="stats" style="display:none">
                <div class="stat-card">
                    <h3>Total modèles</h3>
                    <div class="value" id="totalArmes">-</div>
                </div>
                <div class="stat-card">
                    <h3>Autre stat</h3>
                    <div class="value" id="otherStat" style="color: #e74c3c;">-</div>
                </div>
            </div>

            <div class="filters">
                <input type="text" id="searchInput" placeholder="Rechercher (modèle, id)" autocomplete="off" />
                <button class="add-btn" id="openAddModel">Ajouter un modèle</button>
            </div>

            <table id="armesTable" aria-label="Liste des modèles d'armes">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th class="photo-cell">Photo</th>
                        <th>Modèle</th>
                        <th>Calibre</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Les lignes seront générées dynamiquement, structure :
                    <tr>
                        <td><div class="cell-inner">123</div></td>
                        <td class="photo-cell"><div class="cell-inner"><img src="..." /></div></td>
                        <td><div class="cell-inner">Nom du modèle</div></td>
                        <td><div class="cell-inner"><button>Modifier</button> <button>Supprimer</button></div></td>
                    </tr>
                    -->
                </tbody>
            </table>

            <div class="pagination" id="pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>



    <div id="weaponModelModal" class="modal" style="display:none;">
        <div class="modal-content"
            style="background:#fff; border-radius:16px; box-shadow:0 15px 35px rgba(0,0,0,0.12); max-width:520px; width:100%; border:4px solid #e6e6e6; padding:0;">
            <div class="modal-header" style="padding:24px 28px 0 28px; border-bottom:none; align-items:center;">
                <img src="data/images/lspd.png" alt="Logo LSPD" style="height:40px; margin-right:16px;" />
                <div style="flex:1;">
                    <h2 style="margin:0; font-size:20px; font-weight:700; color:#222;">Catalogue : Modèle</h2>
                    <h3 id="modalTitle" style="margin:4px 0 0; font-size:14px; color:#7f8c8d; font-weight:500;">Ajouter
                        un modèle</h3>
                </div>
                <span class="close" id="modalClose"
                    style="cursor:pointer; font-size:28px; margin-left:12px;">&times;</span>
            </div>
            <div class="modal-body" style="padding:24px 28px 0 28px;">
                <form id="modalForm" style="display:flex; flex-direction:column; gap:18px;">
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <label for="model_name_modal" style="font-weight:600; color:#222; font-size:15px;">Nom du
                            modèle</label>
                        <input type="text" id="model_name_modal" required
                            style="padding:12px 16px; border:2px solid #e6e6e6; border-radius:8px; font-size:15px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.04);" />
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <label for="calibre_modal" style="font-weight:600; color:#222; font-size:15px;">Calibre</label>
                        <input type="text" id="calibre_modal" required placeholder="Calibre"
                            style="padding:12px 16px; border:2px solid #e6e6e6; border-radius:8px; font-size:15px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.04);" />
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <label for="image_url_modal" style="font-weight:600; color:#222; font-size:15px;">URL de
                            l'image</label>
                        <input type="url" id="image_url_modal" placeholder="https://..."
                            style="padding:12px 16px; border:2px solid #e6e6e6; border-radius:8px; font-size:15px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.04);" />
                    </div>
                    <input type="hidden" id="model_id_modal" />
                </form>
            </div>
            <div class="modal-footer"
                style="padding:24px 28px 24px 28px; border-top:none; display:flex; gap:12px; justify-content:flex-end;">
                <button type="button" id="cancelModelBtn" class="btn btn-secondary"
                    style="min-width:110px;">Annuler</button>
                <button type="button" id="saveModelBtn" class="send-button"
                    style="min-width:110px; background:#27ae60; color:#fff; border-radius:8px; font-weight:600; font-size:15px; border:none; box-shadow:0 2px 8px rgba(39,174,96,0.08);">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale de confirmation suppression -->
    <div id="deleteConfirmModal" class="modal" style="display:none;">
        <div class="modal-content"
            style="background:#fff; border-radius:16px; box-shadow:0 15px 35px rgba(0,0,0,0.12); max-width:400px; width:100%; border:4px solid #e6e6e6; padding:0;">
            <div class="modal-header" style="padding:24px 28px 0 28px; border-bottom:none; align-items:center;">
                <div style="flex:1;">
                    <h2 style="margin:0; font-size:18px; font-weight:700; color:#222;">Confirmation</h2>
                </div>
                <span class="close" id="deleteModalClose"
                    style="cursor:pointer; font-size:28px; margin-left:12px;">&times;</span>
            </div>
            <div class="modal-body" style="padding:24px 28px 0 28px;">
                <div id="deleteConfirmText" style="font-size:16px; color:#222;">Voulez-vous vraiment supprimer ce modèle
                    ?</div>
            </div>
            <div class="modal-footer"
                style="padding:24px 28px 24px 28px; border-top:none; display:flex; gap:12px; justify-content:flex-end;">
                <button type="button" id="cancelDeleteBtn" class="btn btn-secondary"
                    style="min-width:110px;">Annuler</button>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger"
                    style="min-width:110px;">Supprimer</button>
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script src="scripts/custom-notifications.js"></script>
    <script src="scripts/weapon-models.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
</body>

</html>
