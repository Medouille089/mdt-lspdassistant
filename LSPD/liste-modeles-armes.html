<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="stylesheet" href="styles/annonce-popup.css" />
    <meta charset="UTF-8" />
    <title>Modèles d'armes - LSPD Assistant</title>
    <link rel="icon" href="data/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link rel="stylesheet" href="styles/custom-notifications.css" />
    <link rel="stylesheet" href="styles/liste-rapports.css" />
    <link rel="stylesheet" href="styles/liste-modeles-armes.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script src="scripts/annonce-popup.js"></script>
    <div id="sidebar-container"></div>
    <script src="scripts/instant-sidebar.js"></script>

    <div class="main-container">
        <h1>Modèles d'armes</h1>

        <div class="content-wrapper">
            <div class="controls-container">
                <div class="search-box">
                    <span class="material-symbols-rounded">search</span>
                    <input type="text" id="searchInput" placeholder="Rechercher (modèle, id)" autocomplete="off" />
                </div>
                <div class="filters">
                    <button class="add-btn" id="openAddModel">
                        <i data-lucide="plus"></i>
                        Ajouter un modèle
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table id="armesTable" aria-label="Liste des modèles d'armes">
                    <thead>
                        <tr>
                            <th class="col-id">ID</th>
                            <th class="col-photo">Photo</th>
                            <th class="col-calibre">Calibre</th>
                            <th class="col-model">Modèle</th>
                            <th class="col-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal ajout/modification -->
    <div id="weaponModelModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-left">
                    <img src="data/images/lspd.png" alt="Logo LSPD" class="modal-logo" />
                    <div class="modal-titles">
                        <h2>Catalogue : Modèle</h2>
                        <h3 id="modalTitle">Ajouter un modèle</h3>
                    </div>
                </div>
                <span class="close" id="modalClose">&times;</span>
            </div>
            <div class="modal-body">
                <form id="modalForm">
                    <div class="form-group">
                        <label for="model_name_modal">Nom du modèle</label>
                        <input type="text" id="model_name_modal" required />
                    </div>
                    <div class="form-group">
                        <label for="calibre_modal">Calibre</label>
                        <input type="text" id="calibre_modal" required placeholder="Calibre" />
                    </div>
                    <div class="form-group">
                        <label for="image_url_modal">URL de l'image</label>
                        <input type="url" id="image_url_modal" placeholder="https://..." />
                        <div id="imagePreviewContainer" class="image-preview-container">
                            <img id="imagePreviewModal" src="" alt="Aperçu" />
                        </div>
                    </div>
                    <input type="hidden" id="model_id_modal" />
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelModelBtn" class="btn btn-secondary">Annuler</button>
                <button type="button" id="saveModelBtn" class="btn btn-success">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale de confirmation suppression -->
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content modal-confirm">
            <div class="modal-header">
                <h2>Confirmation</h2>
                <span class="close" id="deleteModalClose">&times;</span>
            </div>
            <div class="modal-body">
                <p id="deleteConfirmText">Voulez-vous vraiment supprimer ce modèle ?</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Annuler</button>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Supprimer</button>
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <script src="scripts/custom-notifications.js"></script>
    <script src="scripts/weapon-models.js"></script>
    <script src="scripts/loadSidebar.js"></script>
    <script src="scripts/context-menu.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
