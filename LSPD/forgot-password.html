<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">

    <title>Réinitialiser le mot de passe - LSPD Assistant</title>

    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/connect.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

    <style>
        .reset-form {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .reset-form h2 {
            color: var(--primary-color, #0b1b5a);
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
        }

        .reset-form p {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color, #0b1b5a);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(11, 27, 90, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color, #0b1b5a) 0%, #1a3a8a 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(11, 27, 90, 0.4);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary-color, #0b1b5a);
            text-decoration: none;
            font-size: 0.9em;
            transition: opacity 0.3s ease;
        }

        .back-link a:hover {
            opacity: 0.8;
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: #ff4444;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: #00ff00;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .info-message {
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 8px;
            padding: 15px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="data/images/lspdcancer.png" alt="LSPD Logo" class="logo" />
        <div class="slogan">To protect and serve.</div>
    </div>

    <div class="main-content">
        <div class="reset-form">
            <h2>Mot de passe oublié</h2>
            <p>Entrez votre nom d'utilisateur pour réinitialiser votre mot de passe</p>

            <div class="info-message">
                💡 Un lien de réinitialisation sera envoyé en message privé Discord si vous avez lié un compte Discord à
                votre compte.
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required placeholder="Votre nom d'utilisateur"
                        autocomplete="username">
                </div>

                <button type="submit" class="submit-button" id="submitBtn">
                    Envoyer le lien de réinitialisation
                </button>
            </form>

            <div class="forgot-password" style="text-align:center;margin-top:20px;">
                <a href="/connect.html" class="forgot-link">← Retour à la connexion</a>
            </div>
            <style>
                .forgot-link {
                    color: var(--main-color, #5865F2);
                    text-decoration: none;
                    font-size: 0.9em;
                    transition: opacity 0.3s ease;
                    display: inline-block;
                    padding-bottom: 2px;
                }
                .forgot-link:hover {
                    opacity: 0.8;
                    text-decoration: underline;
                }
            </style>
        </div>
    </div>

    <div class="watermark">LSPD Assistant</div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();

            if (!username) {
                showError('Veuillez entrer votre nom d\'utilisateur');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours...';

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess(data.message || 'Si ce compte existe, un lien de réinitialisation a été envoyé en message privé Discord.');
                    document.getElementById('resetForm').reset();
                } else {
                    showError(data.error || 'Erreur lors de l\'envoi du lien de réinitialisation');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showError('Erreur de connexion au serveur');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Envoyer le lien de réinitialisation';
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            successDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.style.display = 'none';
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</body>

</html>
