<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">

    <title>Réinitialiser le mot de passe - LSPD Assistant</title>

    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/connect.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/forgot-password.css" />
</head>

<body>
    <div class="header">
        <img src="data/images/lspdcancer.png" alt="LSPD Logo" class="logo" />
        <div class="slogan">To protect and serve.</div>
    </div>

    <div class="main-content">
        <div class="reset-form">
            <h2>Mot de passe oublié</h2>
            <p>Entrez votre nom d'utilisateur pour réinitialiser votre mot de passe</p>

            <div class="info-message">
                💡 Un lien de réinitialisation sera envoyé en message privé Discord si vous avez lié un compte Discord à
                votre compte.
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required placeholder="Votre nom d'utilisateur"
                        autocomplete="username">
                </div>

                <button type="submit" class="submit-button" id="submitBtn">
                    Envoyer le lien de réinitialisation
                </button>
            </form>

            <div class="forgot-password" style="text-align:center;margin-top:20px;">
                <a href="/connect" class="forgot-link">← Retour à la connexion</a>
            </div>
        </div>
    </div>

    <div class="watermark">LSPD Assistant</div>

    <script src="scripts/context-menu.js"></script>
    <script src="scripts/forgot-password.js"></script>
</body>

</html>
