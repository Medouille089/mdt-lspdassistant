<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Créer une sanction - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/checkmark.css">
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/warning.css">
  <link rel="stylesheet" href="styles/sanctions.css">
  <link rel="stylesheet" href="styles/popup.css">
</head>

<body>
  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-spinner"></div>
  </div>
  <div class="main-container">
    <div id="sidebar-container"></div>
    <h1>Nouvelle sanction</h1>
    <div class="sanction-container">
      <form id="sanctionForm">
        <label for="agent">Agent sanctionné :</label>
        <select id="agent">
          <option value="">-- Choisir un agent --</option>
        </select>

        <label for="type">Type de sanction :</label>
        <select id="type">
          <option value="">-- Choisir un type de sanction --</option>
        </select>

        <label for="start_date">Du :</label>
        <input type="date" id="start_date">

        <label for="end_date">Au :</label>
        <input type="date" id="end_date">

        <label for="reason">Raison :</label>
        <textarea id="reason"></textarea>

        <div class="user-info-row">
          <div class="user-info-field">
            <label for="officier">Agent sanctionneur :</label>
            <input type="text" id="officier" readonly>
          </div>
          <div class="user-info-field">
            <label for="grade">Grade :</label>
            <input type="text" id="grade" readonly>
          </div>
        </div>

        <div class="button-container">
          <button type="submit" id="submit">Appliquer la sanction</button>
        </div>
      </form>
    </div>
  </div>
  </div>

  <div id="customConfirmSend" class="custom-confirm-overlay" style="display:none;">
    <div class="custom-confirm-box">
      <p>Confirmer l'envoi de cette sanction ?</p>
      <div class="custom-confirm-buttons">
        <button class="btn btn-blue">Annuler</button>
        <button class="btn btn-red">Confirmer</button>
      </div>
    </div>
  </div>

  <div id="feedbackAnimation" style="display: none; text-align: center;"></div>
  <script src="scripts/loadSidebar.js"></script>
  <script src="scripts/sanctions/sanctions.js"></script>
</body>

</html>
