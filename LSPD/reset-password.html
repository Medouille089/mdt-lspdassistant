<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data/images/favicon.png" type="image/png">

    <title>Nouveau mot de passe - LSPD Assistant</title>

    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/connect.css">
    <link rel="stylesheet" href="styles/context-menu.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="styles/reset-password.css" />
</head>

<body>
    <div class="header">
        <img src="data/images/lspdcancer.png" alt="LSPD Logo" class="logo" />
        <div class="slogan">To protect and serve.</div>
    </div>

    <div class="main-content">
        <div class="reset-form">
            <h2>Nouveau mot de passe</h2>
            <p>Choisissez un nouveau mot de passe sécurisé</p>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="password">Nouveau mot de passe</label>
                    <div style="position:relative;">
                        <input type="password" id="password" name="password" required
                            placeholder="Choisissez un mot de passe sécurisé" minlength="8" autocomplete="new-password">
                        <button type="button" class="password-eye-btn" id="togglePasswordBtn" tabindex="-1">
                            <span id="eyePassword" class="material-symbols-outlined">visibility</span>
                            <!-- Icône Google Material Symbol: oeil -->
                        </button>
                    </div>
                    <div class="password-requirements">Minimum 8 caractères, incluez majuscules, minuscules et chiffres
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <div style="position:relative;">
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            placeholder="Confirmez votre mot de passe" autocomplete="new-password">
                        <button type="button" class="password-eye-btn" id="toggleConfirmBtn" tabindex="-1">
                            <span id="eyeConfirm" class="material-symbols-outlined">visibility</span>
                            <!-- Icône Google Material Symbol: oeil -->
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="submitBtn">
                    Réinitialiser le mot de passe
                </button>
            </form>
        </div>
    </div>

    <div class="watermark">LSPD Assistant</div>

    <script src="scripts/context-menu.js"></script>
    <script src="scripts/reset-password.js"></script>
</body>

</html>
