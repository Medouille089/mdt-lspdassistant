<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Catalogue modèles d'armes - LSPD Assistant</title>
  <link rel="icon" href="data/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/loader.css" />
  <link rel="stylesheet" href="styles/incident/incident.css" />
  <link rel="stylesheet" href="styles/custom-notifications.css" />
  <link rel="stylesheet" href="styles/context-menu.css" />
  <style>
    /* Modal styling matching incident form look (local override) */
    .modal {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: var(--white);
      border-radius: 12px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      border: 4px solid var(--border-color);
      overflow: hidden;
    }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:3px solid var(--border-color); }
    .modal-header h3 { margin:0; font-size:18px; }
    .modal-body { padding:18px 20px; }
    .modal-footer { padding:16px 20px; border-top:1px solid var(--border-input); display:flex; gap:8px; justify-content:flex-end; }

    /* Button styles for edit/delete similar to infos citizens */
    .btn.btn-warning {
      background: linear-gradient(45deg, #ffb84d, #ff9800);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn.btn-warning:hover { transform: translateY(-2px); }

    .btn.btn-danger {
      background: linear-gradient(45deg, #ff6b6b, #e74c3c);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn.btn-danger:hover { transform: translateY(-2px); }

    /* Make the secondary (Annuler) button match modal action styling */
    .btn.btn-secondary {
      background: transparent;
      color: var(--text-color, #222);
      border: 1px solid var(--border-input, #d0d0d0);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s ease-in-out;
      box-shadow: none;
    }
    .btn.btn-secondary:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.02));
      border-color: var(--border-color);
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <script src="scripts/instant-sidebar.js"></script>

  <div class="main-container">
    <h1>Catalogue : Modèles d'armes</h1>
    <button id="backlinkBtn" class="backlink-btn">← Retour</button>

    <div class="incident-container">
      <div class="header">
        <img src="data/images/lspd.png" alt="Logo LSPD" />
        <div class="header-title">
          <h2>LOS SANTOS POLICE DEPARTMENT</h2>
          <h3 class="title">CATALOGUE MODÈLES D'ARMES</h3>
        </div>
        <div style="width:120px; text-align:right;">
          <button id="openAddModel" class="send-button">+</button>
        </div>
      </div>

      <div id="modelsList" style="margin-top:12px;"></div>
    </div>

    <!-- Modal for add/edit model (uses generic modal classes) -->
    <div id="weaponModelModal" class="modal" style="display:none;">
      <div class="modal-content" style="max-width:720px; width:100%;">
        <div class="modal-header">
          <h3 id="modalTitle">Ajouter un modèle</h3>
          <span class="close" id="modalClose">&times;</span>
        </div>
        <div class="modal-body">
          <form id="modalForm">
            <label for="model_name_modal">Nom du modèle</label>
            <input type="text" id="model_name_modal" required />

            <label for="image_url_modal">URL de l'image (optionnel)</label>
            <input type="url" id="image_url_modal" placeholder="https://..." />

            <input type="hidden" id="model_id_modal" />
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelModelBtn" class="btn btn-secondary">Annuler</button>
          <button type="button" id="saveModelBtn" class="send-button">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="loaderOverlay" class="loader-overlay" style="display:none;"><div class="loader-spinner"></div></div>
  <div id="feedbackAnimation" style="display:none"></div>

  <script src="scripts/loadSidebar.js"></script>
  <script src="scripts/custom-notifications.js"></script>
  <script src="scripts/weapon-models.js"></script>
</body>
</html>
